<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=theme-color content=#0f8b8d><title>GlobeDisc — MCQ Practice</title><style>*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui}.top{background:#fff;border-bottom:1px solid #dcebec;padding:12px}.top button,.btn{border:0;border-radius:12px;padding:10px 14px;background:#e8f6f7;color:#0f7779;font-weight:700}.wrap{max-width:750px;margin:auto;padding:18px 14px}.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:18px;margin-bottom:12px}.q{border:1px solid #dcebec;border-radius:14px;padding:14px;margin:10px 0}.opt{display:block;padding:10px;margin:6px 0;border:1px solid #dcebec;border-radius:10px;cursor:pointer}.score{font-size:20px;font-weight:800;color:#0f8587}</style></head><body><header class=top><button onclick=history.back()>←</button> <b>GlobeDisc · MCQ Practice</b></header><main class=wrap><section class=panel><h2>Practice MCQs</h2><p>Choose a subject and generate a quick set.</p><input id=topic placeholder="Topic e.g. Python, Networking" style="width:100%;padding:11px;border:1px solid #cfe4e5;border-radius:11px"><button class=btn onclick=generate()>Generate 5 MCQs</button></section><section class=panel id=quiz></section></main><script>let qs=[];function generate(){let t=topic.value.trim()||"Computer Science";qs=[{q:"Which concept is most closely related to "+t+"?",o:["A fundamental principle","A random value","A file extension","A keyboard shortcut"],a:0},{q:"Which approach is generally best when learning "+t+"?",o:["Practice and review","Never test yourself","Avoid examples","Skip fundamentals"],a:0},{q:"What should you do when unsure about a "+t+" concept?",o:["Verify with reliable sources","Guess permanently","Ignore it","Delete your notes"],a:0},{q:"Which habit improves technical understanding?",o:["Building small projects","Only memorizing","Avoiding errors","Skipping practice"],a:0},{q:"What is a good way to measure progress in "+t+"?",o:["Regular practice tests","Never reviewing","Only reading titles","Changing topics every minute"],a:0}];quiz.innerHTML=qs.map((x,i)=>'<div class=q><b>'+(i+1)+'. '+x.q+'</b>'+x.o.map((o,j)=>'<label class=opt><input type=radio name=q'+i+' value='+j+'> '+o+'</label>').join("")+'</div>').join("")+'<button class=btn onclick=check()>Check Score</button><div id=result></div>'}function check(){let s=0;qs.forEach((x,i)=>{let v=document.querySelector('input[name=q'+i+']:checked');if(v&&+v.value===x.a)s++});result.innerHTML='<p class=score>'+s+' / '+qs.length+'</p><small>Review the questions you missed and practice again.</small>'}</script></body></html>
