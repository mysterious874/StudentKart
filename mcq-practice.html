<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=theme-color content=#0f8b8d><title>GlobeDisc — MCQ Practice</title><style>*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui}.top{background:#fff;border-bottom:1px solid #dcebec;padding:12px}.top button,.btn{border:0;border-radius:12px;padding:10px 14px;background:#e8f6f7;color:#0f7779;font-weight:700}.wrap{max-width:750px;margin:auto;padding:18px 14px}.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:18px;margin-bottom:12px}.q{border:1px solid #dcebec;border-radius:14px;padding:14px;margin:10px 0}.opt{display:block;padding:10px;margin:6px 0;border:1px solid #dcebec;border-radius:10px;cursor:pointer}.score{font-size:20px;font-weight:800;color:#0f8587}</style></head><body><header class=top><button onclick=history.back()>←</button> <b>GlobeDisc · MCQ Practice</b></header><main class=wrap><section class=panel><h2>Practice MCQs</h2><p>Choose a subject and generate a quick set.</p><input id=topic placeholder="Topic e.g. Python, Networking" style="width:100%;padding:11px;border:1px solid #cfe4e5;border-radius:11px"><button class=btn onclick=generate()>Generate 5 MCQs</button></section><section class=panel id=quiz></section></main><script>let qs=[];const bank={python:[["Which keyword defines a function?",["def","func","function","lambda"],0],["Which type stores key-value pairs?",["list","tuple","dict","set"],2],["What starts a comment?",["//","#","<!--","/*"],1]],networking:[["Which protocol resolves domain names?",["DNS","FTP","SSH","SMTP"],0],["HTTP commonly uses port?",["21","25","80","110"],2],["Which device forwards packets between networks?",["Switch","Router","Hub","Repeater"],1]],javascript:[["Which keyword declares a constant?",["let","var","const","static"],2],["Which method converts JSON text to an object?",["JSON.parse","JSON.object","JSON.decode","parse.JSON"],0],["Which symbol starts a single-line comment?",["#","//","<!--","**"],1]]};function generate(){let t=topic.value.trim()||"Computer Science",k=t.toLowerCase(),base=bank[k]||bank[k.includes("network")?"networking":k.includes("python")?"python":k.includes("javascript")||k.includes("js")?"javascript":"python"];qs=[...base,...base].slice(0,5);quiz.innerHTML=qs.map((x,i)=>'<div class=q><b>'+(i+1)+'. '+x[0]+'</b>'+x[1].map((o,j)=>'<label class=opt><input type=radio name=q'+i+' value='+j+'> '+o+'</label>').join("")+'</div>').join("")+'<button class=btn onclick=check()>Check Score</button><div id=result></div>'}function check(){let s=0;qs.forEach((x,i)=>{let v=document.querySelector('input[name=q'+i+']:checked');if(v&&+v.value===x[2])s++});result.innerHTML='<p class=score>'+s+' / '+qs.length+'</p><small>'+ (s===qs.length?'Excellent!':'Review the missed questions and try again.')+'</small>'}</script></body></html>
