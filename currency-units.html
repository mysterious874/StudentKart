<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — Currency & Units</title><link rel="icon" href="/icons/globedisc-icon-v2.svg"><style>*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.top{position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid #dcebec;padding:12px 14px;display:flex;gap:10px;align-items:center;z-index:3}.top button{border:0;border-radius:12px;padding:10px 13px;background:#e8f6f7;color:#0f7779}.brand img{width:32px;vertical-align:middle}.brand strong{margin-left:7px}.brand small{display:block;margin-left:39px;color:#668184}main{max-width:850px;margin:auto;padding:18px 14px 50px}.hero,.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:18px;margin-bottom:13px}.hero{background:linear-gradient(135deg,#e9fbfb,#fff)}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tab{white-space:nowrap;border:1px solid #cfe4e5;background:#fff;border-radius:11px;padding:9px 12px;color:#456b6d}.tab.active{background:#0f8b8d;color:#fff;border-color:#0f8b8d}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}input,select{width:100%;padding:12px;border:1px solid #cfe4e5;border-radius:12px;background:#fff;font:inherit}.btn{border:0;border-radius:12px;padding:11px 14px;background:#0f8b8d;color:#fff;font-weight:700;margin-top:9px}.result{margin-top:12px;background:#f5fbfc;border:1px solid #dcebec;border-radius:13px;padding:14px;font-size:20px;font-weight:800;color:#0f7779}.muted{color:#667b7e;font-size:12px}.hidden{display:none}@media(max-width:550px){.row{grid-template-columns:1fr}}</style></head><body><header class="top"><button onclick="location.href='features.html'">←</button><div class="brand"><img src="/icons/globedisc-icon-v2.svg"><strong>GlobeDisc</strong><small>Currency & Units</small></div></header><main><section class="hero"><b style="color:#0f8587">GLOBEDISC · UTILITIES</b><h1>Convert anything, quickly.</h1><p class="muted">Live currency rates and everyday unit conversions in one compact tool.</p></section><div class="tabs"><button class="tab active" data-tab="currency">Currency</button><button class="tab" data-tab="length">Length</button><button class="tab" data-tab="weight">Weight</button><button class="tab" data-tab="temperature">Temperature</button><button class="tab" data-tab="data">Data</button></div><section class="panel" id="currency"><h3>Currency Converter</h3><div class="row"><div><label class="muted">Amount</label><input id="amount" type="number" value="1" min="0"></div><div><label class="muted">From</label><select id="from"></select></div><div><label class="muted">To</label><select id="to"></select></div></div><button class="btn" id="convert">Convert</button><div class="result" id="cres">Loading currencies…</div><div class="muted" id="updated"></div></section><section class="panel hidden" id="unit"><h3 id="unitTitle">Unit Converter</h3><div class="row"><div><label class="muted">Value</label><input id="value" type="number" value="1"></div><div><label class="muted">From</label><select id="ufrom"></select></div><div><label class="muted">To</label><select id="uto"></select></div></div><button class="btn" id="uconvert">Convert</button><div class="result" id="ures"></div></section></main><script>const currencies={USD:"US Dollar",INR:"Indian Rupee",EUR:"Euro",GBP:"British Pound",JPY:"Japanese Yen",AED:"UAE Dirham",AUD:"Australian Dollar",CAD:"Canadian Dollar",SGD:"Singapore Dollar",CNY:"Chinese Yuan",CHF:"Swiss Franc",SAR:"Saudi Riyal"};const f=document.getElementById("from"),t=document.getElementById("to");Object.entries(currencies).forEach(([c,n])=>{f.add(new Option(c+" — "+n,c));t.add(new Option(c+" — "+n,c))});f.value="INR";t.value="USD";let rates=null;async function loadRates(){try{const r=await fetch("https://api.frankfurter.app/latest?from=INR");if(!r.ok)throw Error();const x=await r.json();rates={INR:1,...x.rates};document.getElementById("updated").textContent="Rates from ECB data · "+x.date;convert()}catch{document.getElementById("cres").textContent="Live rates unavailable. Try again shortly."}}function convert(){if(!rates)return;const a=Number(document.getElementById("amount").value)||0,from=f.value,to=t.value;const inr=a/(rates[from]||1),v=inr*(rates[to]||1);document.getElementById("cres").textContent=a.toLocaleString()+" "+from+" ≈ "+v.toLocaleString(undefined,{maximumFractionDigits:4})+" "+to}document.getElementById("convert").onclick=convert;loadRates();const sets={length:{title:"Length Converter",units:{m:1,km:1000,cm:.01,mm:.001,ft:.3048,in:.0254,mi:1609.344}},weight:{title:"Weight Converter",units:{kg:1,g:.001,mg:.000001,lb:.45359237,oz:.0283495}},temperature:{title:"Temperature Converter",units:{C:"C",F:"F",K:"K"}},data:{title:"Data Converter",units:{B:1,KB:1024,MB:1048576,GB:1073741824,TB:1099511627776}}};let current="length";function setup(k){current=k;const s=sets[k],a=document.getElementById("ufrom"),b=document.getElementById("uto");a.innerHTML=b.innerHTML="";Object.keys(s.units).forEach(u=>{a.add(new Option(u,u));b.add(new Option(u,u))});document.getElementById("unitTitle").textContent=s.title;unitConvert()}function unitConvert(){const s=sets[current],v=Number(document.getElementById("value").value)||0,a=document.getElementById("ufrom").value,b=document.getElementById("uto").value;let out;if(current==="temperature"){let c=a==="C"?v:a==="F"?(v-32)*5/9:v-273.15;out=b==="C"?c:b==="F"?c*9/5+32:c+273.15}else out=v*s.units[a]/s.units[b];document.getElementById("ures").textContent=v+" "+a+" = "+Number(out.toFixed(8))+" "+b}document.getElementById("uconvert").onclick=unitConvert;document.querySelectorAll(".tab").forEach(x=>x.onclick=()=>{document.querySelectorAll(".tab").forEach(y=>y.classList.remove("active"));x.classList.add("active");const k=x.dataset.tab;document.getElementById("currency").classList.toggle("hidden",k!=="currency");document.getElementById("unit").classList.toggle("hidden",k==="currency");if(k!=="currency")setup(k)});setup("length");try{const a=JSON.parse(localStorage.getItem("globedisc_recent_tools")||"[]");a.push({name:"Currency & Unit Converter",at:Date.now()});localStorage.setItem("globedisc_recent_tools",JSON.stringify(a.slice(-30)))}catch{}</script></body></html>
