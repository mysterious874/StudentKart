font-weight:700;cursor:pointer}.primary{background:#0f8b8d;color:#fff}.secondary{background:#e8f6f7;color:#0f7779}.status{font-size:12px;color:#718486;margin-top:9px;min-height:17px}.result{display:none;margin-top:14px;border:1px solid #dcebec;border-radius:14px;overflow:hidden}.rhead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#eef9f9;border-bottom:1px solid #dcebec;font-size:13px;font-weight:700}.result pre{margin:0;padding:16px;white-space:pre-wrap;word-break:break-word;font:13px/1.6 system-ui;color:#183b3e;background:#fbfefe}</style></head><body><header class="top"><button class="back" onclick="location.href='features.html'">←</button><div class="brand"><img src="/icons/globedisc-icon-v2.svg"><div><strong>GlobeDisc</strong><small>AI Calculator</small></div></div></header><main><section class="hero"><div class="ey">AI TOOLS · CALCULATOR</div><h1>Calculate with AI</h1><p>Type a calculation, equation, percentage, algebra problem or word problem in plain language.</p></section><section class="panel"><div class="quick"><button class="chip" data-q="Calculate 18% of 2500">18% of 2500</button><button class="chip" data-q="Solve 2x + 7 = 19">Solve 2x + 7 = 19</button><button class="chip" data-q="What is the compound interest on ₹50000 at 8% per year for 3 years?">Compound interest</button><button class="chip" data-q="Convert 5/8 into a percentage">Fraction to %</button></div><div class="field"><label>What do you want to calculate?</label><textarea id="question" placeholder="Example: If I score 78, 82, 91 and 89, what is my average?"></textarea></div><div class="actions"><button class="btn primary" id="solve">Calculate</button><button class="btn secondary" id="clear">Clear</button></div><div class="status" id="status"></div><div class="result" id="result"><div class="rhead"><span>Calculation Result</span><button class="btn secondary" id="copy" style="padding:7px 10px;font-size:12px">Copy</button></div><pre id="answer"></pre></div></section></main><script>const URL="https://yymzfjfkmsrymqhpnfqz.supabase.co",KEY="sb_publishable_tEePI-aSGDkt_2S6oiEfPw_Hy_mEXkw",$=id=>document.getElementById(id);document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{$("question").value=b.dataset.q;$("question").focus()});async function solve(){const q0=$("question").value.trim();if(!q0){$("status").textContent="Enter a calculation first.";return}const q=`Act as a precise math calculator and tutor. Solve this calculation/problem: ${q0}. Show the relevant formula or steps briefly, calculate carefully, and give the final answer clearly. Preserve units and currency. For percentages, averages, interest, algebra and word problems, show enough working to verify the result. Do not invent missing values; if something is missing, say what is needed.`;$("solve").disabled=true;$("status").textContent="Calculating…";$("result").style.display="none";try{const r=await fetch(URL+"/functions/v1/ai-chat",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({question:q,history:[],research:false})});const x=await r.json();if(!r.ok)throw Error(x?.error||x?.message||"AI request failed");$("answer").textContent=x.answer||x.response||x.text||x.message||"No result returned.";$("result").style.display="block";$("status").textContent="Calculation ready."}catch(e){$("status").textContent="Could not calculate. "+e.message}finally{$("solve").disabled=false}}$("solve").onclick=solve;$("clear").onclick=()=>{$("question").value="";$("result").style.display="none";$("answer").textContent="";$("status").textContent=""};$("copy").onclick=async()=>{await navigator.clipboard.writeText($("answer").textContent);$("status").textContent="Result copied."}</script></body></html>
