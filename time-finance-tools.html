<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=theme-color content=#0f8b8d><title>GlobeDisc — Time & Finance</title><style>*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui}.top{background:#fff;border-bottom:1px solid #dcebec;padding:12px}.btn{border:0;border-radius:12px;padding:10px 14px;background:#e8f6f7;color:#0f7779;font-weight:700}.wrap{max-width:760px;margin:auto;padding:18px 14px}.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{border:1px solid #dcebec;border-radius:14px;padding:14px}input{width:100%;padding:11px;border:1px solid #cfe4e5;border-radius:11px;margin:5px 0}.out{font-size:18px;font-weight:800;color:#0f8587}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header class=top><button class=btn onclick=history.back()>←</button> <b>GlobeDisc · Time & Finance</b></header><main class=wrap><section class=panel><h2>Quick Tools</h2><div class=grid><div class=box><h3>World Clock</h3><p id=clock></p></div><div class=box><h3>EMI Calculator</h3><input id=p placeholder="Loan amount" type=number><input id=r placeholder="Annual interest %" type=number><input id=n placeholder="Months" type=number><button class=btn onclick=emi()>Calculate EMI</button><p class=out id=e></p></div></div></section></main><script>function tick(){clock.innerHTML=['UTC','Asia/Kolkata','America/New_York','Europe/London','Asia/Tokyo'].map(z=>z+': '+new Intl.DateTimeFormat('en-IN',{timeZone:z,dateStyle:'medium',timeStyle:'medium'}).format(new Date())).join('<br>')}setInterval(tick,1000);tick();function emi(){let P=+p.value||0,R=(+r.value||0)/1200,N=+n.value||0;if(!P||!N)return e.textContent='Enter loan details';let m=R?P*R*Math.pow(1+R,N)/(Math.pow(1+R,N)-1):P/N;e.textContent='Monthly EMI: ₹'+m.toFixed(2)+'</br>Total: ₹'+(m*N).toFixed(2)}</script></body></html>
