<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — Daily Tools</title><link rel="icon" href="/icons/globedisc-icon-v2.svg">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid #dcebec;padding:11px 14px;display:flex;align-items:center;gap:10px}.top button,.btn{border:0;border-radius:12px;padding:10px 13px;background:#e8f6f7;color:#0f7779;font-weight:700}.brand{font-weight:800}.page{max-width:980px;margin:auto;padding:16px 14px 60px}.hero,.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:18px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#e9fbfb,#fff)}h1{margin:3px 0 5px;font-size:clamp(25px,6vw,36px)}h2,h3{margin-top:0}.muted{color:#65787a}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{border:1px solid #dcebec;border-radius:14px;padding:14px;background:#fbfefe}.card strong{display:block;margin-bottom:4px}.icon{width:38px;height:38px;border-radius:11px;background:#e8f7f7;color:#0f8587;display:grid;place-items:center;margin-bottom:9px}.tool{display:none}.tool.active{display:block}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cfe4e5;border-radius:11px;margin:5px 0;font:inherit}textarea{min-height:100px}.row{display:flex;gap:7px;flex-wrap:wrap}.out{white-space:pre-wrap;background:#f7fcfc;border:1px solid #dcebec;border-radius:11px;padding:11px;margin-top:8px;overflow:auto}.todo{display:flex;gap:8px;align-items:center;padding:9px;border-bottom:1px solid #e5eeee}.todo.done span{text-decoration:line-through;opacity:.55}.todo span{flex:1}.timer{font-size:42px;font-weight:800;text-align:center;padding:15px}.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.swatch{height:44px;border-radius:10px;border:1px solid #dcebec;cursor:pointer}@media(max-width:650px){.grid{grid-template-columns:1fr}.swatches{grid-template-columns:repeat(3,1fr)}} 
</style></head><body>
<header class="top"><button onclick="location.href='features.html'">←</button><div class="brand">GlobeDisc · Daily Tools</div></header>
<main class="page"><section class="hero"><span style="font-size:12px;color:#0f8587;font-weight:800">DAILY TOOLKIT</span><h1>Small tools, all in one place.</h1><p class="muted">Fast browser-based utilities for study, work and everyday tasks.</p></section>
<section class="panel"><div class="grid" id="cards"></div></section><section class="panel"><div id="tool"></div></section></main>
<script>
const tools=[
["To-Do List","Create a simple task list","todo","fa-check-double"],["Pomodoro","25-minute focus timer","pomodoro","fa-clock"],["Date & Calendar","Date difference and day finder","date","fa-calendar-days"],["Dictionary","Look up an English word","dict","fa-book"],["Timezone","Compare times around the world","zone","fa-earth-americas"],["Text Tools","Count words, characters and lines","text","fa-align-left"],["JSON Formatter","Format or validate JSON","json","fa-code"],["Base64","Encode or decode text","base64","fa-lock"],["URL Encoder","Encode or decode URLs","url","fa-link"],["Color Picker","Pick a color and copy its HEX","color","fa-palette"],["Image Compressor","Compress an image in your browser","image","fa-image"],["Random Picker","Pick a random item from a list","random","fa-shuffle"]];
const cards=document.getElementById("cards"),tool=document.getElementById("tool");
cards.innerHTML=tools.map((x,i)=>`<button class="card" style="text-align:left" onclick="openTool(${i})"><div class="icon"><i class="fas ${x[3]}"></i></div><strong>${x[0]}</strong><small class="muted">${x[1]}</small></button>`).join("");
function openTool(i){const n=tools[i][2];const t={todo:`<h3>To-Do List</h3><div class="row"><input id="todoIn" placeholder="Add a task"><button class="btn" onclick="addTodo()">Add</button></div><div id="todos" class="out"></div>`,pomodoro:`<h3>Pomodoro</h3><div id="timer" class="timer">25:00</div><div class="row"><button class="btn" onclick="timerStart()">Start</button><button class="btn" onclick="timerReset()">Reset</button></div>`,date:`<h3>Date & Calendar</h3><label>Start date</label><input id="d1" type="date"><label>End date</label><input id="d2" type="date"><button class="btn" onclick="dateDiff()">Calculate</button><div id="dateOut" class="out"></div>`,dict:`<h3>Dictionary</h3><input id="word" placeholder="Enter an English word"><button class="btn" onclick="lookupWord()">Look up</button><div id="dictOut" class="out"></div>`,zone:`<h3>World Time</h3><div id="zones"></div>`,text:`<h3>Text Tools</h3><textarea id="textIn" placeholder="Paste text here…"></textarea><div id="textOut" class="out">Words: 0 · Characters: 0 · Lines: 0</div>`,json:`<h3>JSON Formatter</h3><textarea id="jsonIn" placeholder='{"hello":"world"}'></textarea><button class="btn" onclick="formatJSON()">Format</button><div id="jsonOut" class="out"></div>`,base64:`<h3>Base64</h3><textarea id="b64In" placeholder="Text"></textarea><div class="row"><button class="btn" onclick="b64('e')">Encode</button><button class="btn" onclick="b64('d')">Decode</button></div><div id="b64Out" class="out"></div>`,url:`<h3>URL Encoder</h3><textarea id="urlIn" placeholder="Text or URL"></textarea><div class="row"><button class="btn" onclick="urlTool('e')">Encode</button><button class="btn" onclick="urlTool('d')">Decode</button></div><div id="urlOut" class="out"></div>`,color:`<h3>Color Picker</h3><input id="color" type="color" value="#0f8b8d" style="height:55px"><div id="colorOut" class="out">#0f8b8d</div>`,image:`<h3>Image Compressor</h3><input id="imgIn" type="file" accept="image/*"><label>Quality</label><input id="quality" type="range" min=".3" max="1" step=".05" value=".75"><div id="imgOut" class="out">Choose an image to begin.</div>`,random:`<h3>Random Picker</h3><textarea id="randomIn" placeholder="One option per line"></textarea><button class="btn" onclick="pickRandom()">Pick</button><div id="randomOut" class="out"></div>`};tool.innerHTML=t[n];tool.className="tool active";tool.scrollIntoView({behavior:"smooth"});if(n==="todo")renderTodos();if(n==="zone")renderZones();if(n==="text")document.getElementById("textIn").addEventListener("input",textStats);if(n==="color")document.getElementById("color").addEventListener("input",e=>document.getElementById("colorOut").textContent=e.target.value.toUpperCase());if(n==="image")document.getElementById("imgIn").addEventListener("change",compressImage)}
let timerId=null,seconds=1500;
function timerPaint(){const m=Math.floor(seconds/60),s=seconds%60;document.getElementById("timer").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
function timerStart(){if(timerId)return;timerId=setInterval(()=>{if(seconds<=0){clearInterval(timerId);timerId=null;alert("Pomodoro complete.");return}seconds--;timerPaint()},1000)}
function timerReset(){clearInterval(timerId);timerId=null;seconds=1500;timerPaint()}
function getTodos(){try{return JSON.parse(localStorage.getItem("globedisc_todos")||"[]")}catch{return[]}}
function renderTodos(){const a=getTodos(),o=document.getElementById("todos");o.innerHTML=a.length?a.map((x,i)=>`<div class="todo ${x.done?"done":""}"><input type="checkbox" ${x.done?"checked":""} onchange="toggleTodo(${i})"><span>${escapeHtml(x.text)}</span><button class="btn" onclick="delTodo(${i})">×</button></div>`).join(""):"No tasks yet."}
function addTodo(){const e=document.getElementById("todoIn"),v=e.value.trim();if(!v)return;const a=getTodos();a.push({text:v,done:false});localStorage.setItem("globedisc_todos",JSON.stringify(a));e.value="";renderTodos()}
function toggleTodo(i){const a=getTodos();a[i].done=!a[i].done;localStorage.setItem("globedisc_todos",JSON.stringify(a));renderTodos()}
function delTodo(i){const a=getTodos();a.splice(i,1);localStorage.setItem("globedisc_todos",JSON.stringify(a));renderTodos()}
function dateDiff(){const a=new Date(document.getElementById("d1").value),b=new Date(document.getElementById("d2").value);if(isNaN(a)||isNaN(b)){document.getElementById("dateOut").textContent="Choose both dates.";return}document.getElementById("dateOut").textContent=Math.round(Math.abs(b-a)/86400000)+" days apart."}
async function lookupWord(){const w=document.getElementById("word").value.trim();const o=document.getElementById("dictOut");if(!w)return;o.textContent="Looking up…";try{const r=await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+encodeURIComponent(w));const x=await r.json();const e=x[0];o.textContent=e?"Meaning: "+(e.meanings?.[0]?.definitions?.[0]?.definition||"Not available."):"Word not found."}catch{o.textContent="Dictionary unavailable."}}
function renderZones(){const c=[["Mumbai","Asia/Kolkata"],["Dubai","Asia/Dubai"],["London","Europe/London"],["New York","America/New_York"],["Tokyo","Asia/Tokyo"],["Sydney","Australia/Sydney"]];document.getElementById("zones").innerHTML=c.map(x=>`<div class="out"><b>${x[0]}</b> · ${new Intl.DateTimeFormat("en-IN",{timeZone:x[1],dateStyle:"medium",timeStyle:"medium"}).format(new Date())}</div>`).join("")}
function textStats(){const v=document.getElementById("textIn").value;document.getElementById("textOut").textContent="Words: "+(v.trim()?v.trim().split(/\s+/).length:0)+" · Characters: "+v.length+" · Lines: "+(v? v.split(/\n/).length:0)}
function formatJSON(){const o=document.getElementById("jsonOut");try{o.textContent=JSON.stringify(JSON.parse(document.getElementById("jsonIn").value),null,2)}catch{o.textContent="Invalid JSON."}}
function b64(m){const v=document.getElementById("b64In").value,o=document.getElementById("b64Out");try{o.textContent=m==="e"?btoa(unescape(encodeURIComponent(v))):decodeURIComponent(escape(atob(v)))}catch{o.textContent="Invalid Base64 text."}}
function urlTool(m){const v=document.getElementById("urlIn").value;document.getElementById("urlOut").textContent=m==="e"?encodeURIComponent(v):decodeURIComponent(v)}
function pickRandom(){const a=document.getElementById("randomIn").value.split(/\n/).map(x=>x.trim()).filter(Boolean);document.getElementById("randomOut").textContent=a.length?a[Math.floor(Math.random()*a.length)]:"Add at least one option."}
function compressImage(e){const f=e.target.files?.[0],o=document.getElementById("imgOut");if(!f)return;const im=new Image();im.onload=()=>{const max=1800,s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{if(!b)return;o.textContent="Original: "+Math.round(f.size/1024)+" KB · Compressed: "+Math.round(b.size/1024)+" KB";const a=document.createElement("a");a.className="btn";a.textContent="Download compressed image";a.href=URL.createObjectURL(b);a.download="globedisc-compressed.jpg";o.appendChild(document.createElement("br"));o.appendChild(a)},"image/jpeg",Number(document.getElementById("quality").value))};im.src=URL.createObjectURL(f)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
</script><script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script></body></html>
