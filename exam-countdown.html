<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — Exam Countdown</title><link rel="icon" href="/icons/globedisc-icon-v2.svg"><style>*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #dcebec;padding:12px;display:flex;gap:10px;align-items:center}.top button,.btn{border:0;border-radius:12px;padding:10px 14px;background:#e8f6f7;color:#0f7779;font-weight:700}.top h2{margin:0}.wrap{max-width:700px;margin:auto;padding:18px 14px}.hero,.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:18px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#e9fbfb,#fff)}input{width:100%;padding:12px;border:1px solid #cfe4e5;border-radius:12px;margin:6px 0;font:inherit}.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px}.box{background:#f7fcfc;border:1px solid #dcebec;border-radius:14px;padding:14px;text-align:center}.box b{display:block;font-size:24px;color:#0f8587}.box small{color:#637779}@media(max-width:520px){.count{grid-template-columns:repeat(2,1fr)}} </style></head><body><header class="top"><button onclick="history.back()">←</button><h2>⏳ Exam Countdown</h2></header><main class="wrap"><section class="hero"><h1>Never miss an exam</h1><p>Set your exam date and keep the live countdown on this device.</p></section><section class="panel"><input id="name" placeholder="Exam name (e.g. BCA Semester Exam)"><input id="date" type="datetime-local"><button class="btn" onclick="save()">Start Countdown</button></section><section class="panel" id="result"><strong>No countdown set.</strong></section></main><script>let timer;function save(){const n=document.getElementById("name").value.trim()||"Exam";const d=document.getElementById("date").value;if(!d)return;localStorage.setItem("globedisc_exam_countdown",JSON.stringify({n,d}));render()}function render(){const x=JSON.parse(localStorage.getItem("globedisc_exam_countdown")||"null");if(!x)return;document.getElementById("name").value=x.n;document.getElementById("date").value=x.d;clearInterval(timer);const el=document.getElementById("result");function tick(){let ms=new Date(x.d).getTime()-Date.now();if(ms<=0){el.innerHTML="<strong>"+x.n+"</strong><p>🎉 Exam time reached.</p>";return}let s=Math.floor(ms/1000),days=Math.floor(s/86400);s%=86400;let h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);s%=60;el.innerHTML="<strong>"+x.n+"</strong><div class=count><div class=box><b>"+days+"</b><small>Days</small></div><div class=box><b>"+h+"</b><small>Hours</small></div><div class=box><b>"+m+"</b><small>Minutes</small></div><div class=box><b>"+s+"</b><small>Seconds</small></div></div>"}tick();timer=setInterval(tick,1000)}render();</script></body></html>
