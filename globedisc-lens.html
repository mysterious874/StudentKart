<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — Lens</title><link rel="icon" href="/icons/globedisc-icon-v2.svg"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5fbfc;color:#102a2c}.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid #dceced;padding:12px 16px;display:flex;align-items:center;gap:12px}.back{border:0;background:#e8f6f7;border-radius:12px;width:42px;height:42px;color:#0f7779;font-size:16px}.brand{display:flex;gap:9px;align-items:center}.brand img{width:36px;height:36px}.brand strong{display:block}.brand small{color:#668184}main{max-width:850px;margin:auto;padding:20px 14px 50px}.hero,.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:18px;margin-bottom:14px}.hero{background:linear-gradient(135deg,#e9fbfb,#fff);border-color:#d7eeee}.ey{font-size:12px;color:#0f8587;font-weight:700}.hero h1{margin:5px 0;font-size:28px}.hero p{margin:7px 0;color:#607477;font-size:14px}.drop{border:2px dashed #cfe4e5;border-radius:15px;padding:20px;text-align:center;background:#fbfefe}.drop input{display:none}.pick{display:inline-block;border:0;border-radius:12px;padding:11px 15px;background:#0f8b8d;color:#fff;font-weight:700;cursor:pointer}.preview{display:none;width:100%;max-height:380px;object-fit:contain;margin-top:14px;border-radius:14px;border:1px solid #dcebec}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#0f8b8d;color:#fff}.secondary{background:#e8f6f7;color:#0f7779}.status{font-size:12px;color:#718486;margin-top:9px;min-height:17px}.result{display:none;margin-top:14px;border:1px solid #dcebec;border-radius:14px;overflow:hidden}.rhead{padding:10px 12px;background:#eef9f9;border-bottom:1px solid #dcebec;font-size:13px;font-weight:700}.result pre{margin:0;padding:16px;white-space:pre-wrap;word-break:break-word;font:13px/1.6 system-ui;background:#fbfefe;color:#183b3e}@media(max-width:650px){.hero h1{font-size:25px}}</style></head><body><header class="top"><button class="back" onclick="location.href='features.html'">←</button><div class="brand"><img src="/icons/globedisc-icon-v2.svg"><div><strong>GlobeDisc</strong><small>Lens</small></div></div></header><main><section class="hero"><div class="ey">GLOBEDISC SPECIAL · LENS</div><h1>See it. Understand it.</h1><p>Upload or capture an image and ask GlobeDisc what you want to know about it.</p></section><section class="panel"><div class="drop"><label class="pick">📷 Choose / Capture Image<input id="file" type="file" accept="image/*" capture="environment"></label><div id="hint" class="status">Max 15 MB.</div><img id="preview" class="preview"></div><div class="actions"><button class="btn primary" id="analyze">Analyze Image</button><button class="btn secondary" id="clear">Clear</button></div><div class="status" id="status"></div><textarea id="ask" style="width:100%;box-sizing:border-box;margin-top:10px;min-height:75px;border:1px solid #cfe4e5;border-radius:12px;padding:11px;font:inherit" placeholder="Optional: What should I focus on? e.g. Identify this product / read this document / explain this diagram"></textarea><div class="result" id="result"><div class="rhead">Lens Result</div><pre id="answer"></pre></div></section></main><script>const URL="https://yymzfjfkmsrymqhpnfqz.supabase.co",KEY="sb_publishable_tEePI-aSGDkt_2S6oiEfPw_Hy_mEXkw",$=id=>document.getElementById(id);let data="";$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>15*1024*1024){$("status").textContent="Image must be under 15 MB.";return}const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);data=canvas.toDataURL("image/jpeg",0.82);$("preview").src=data;$("preview").style.display="block";$("status").textContent="Image ready."};img.src=rd.result};rd.readAsDataURL(f)};$("analyze").onclick=async()=>{if(!data){$("status").textContent="Choose an image first.";return}const focus=$("ask").value.trim()||"Analyze this image and identify what is visible. Read useful text, explain the scene or object, note important details, and clearly state uncertainty.";const q=`You are GlobeDisc Lens. Analyze the supplied image. User focus: ${focus}. Give a concise but useful result. If it is a product, identify likely type/model only when supported and describe visible specs. If it is a document, extract readable text and explain it. If it is a chart or diagram, explain it. Never invent details or claim certainty when the image is unclear.`;$("analyze").disabled=true;$("status").textContent="Analyzing image…";$("result").style.display="none";try{const r=await fetch(URL+"/functions/v1/ai-chat",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({question:q,history:[],research:false,image:data})});const x=await r.json();if(!r.ok)throw Error(x?.error||x?.message||"AI request failed");$("answer").textContent=x.answer||x.response||x.text||x.message||"No result returned.";$("result").style.display="block";$("status").textContent="Lens analysis ready."}catch(e){$("status").textContent="Could not analyze image. "+e.message}finally{$("analyze").disabled=false}};$("clear").onclick=()=>{data="";$("file").value="";$("preview").style.display="none";$("result").style.display="none";$("ask").value="";$("status").textContent=""}</script></body></html>
