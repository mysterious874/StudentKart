<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — Voice to Text</title><link rel="icon" href="/icons/globedisc-icon-v2.svg"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5fbfc;color:#102a2c}.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid #dceced;padding:12px 16px;display:flex;align-items:center;gap:12px}.back{border:0;background:#e8f6f7;border-radius:12px;width:42px;height:42px;color:#0f7779;font-size:16px}.brand{display:flex;gap:9px;align-items:center}.brand img{width:36px;height:36px}.brand strong{display:block}.brand small{color:#668184}main{max-width:850px;margin:auto;padding:20px 14px 50px}.hero,.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:18px;margin-bottom:14px}.hero{background:linear-gradient(135deg,#e9fbfb,#fff);border-color:#d7eeee}.ey{font-size:12px;color:#0f8587;font-weight:700}.hero h1{margin:5px 0;font-size:28px}.hero p{margin:7px 0;color:#607477;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:12px}label{display:block;font-size:12px;font-weight:700;color:#557174;margin-bottom:7px}select,textarea{width:100%;border:1px solid #cfe4e5;border-radius:12px;background:#fbfefe;color:#17383b;padding:11px 12px;font:inherit}textarea{min-height:210px;resize:vertical}.controls{display:flex;justify-content:center;margin:8px 0 14px}.mic{width:78px;height:78px;border-radius:50%;border:0;background:#0f8b8d;color:#fff;font-size:28px;cursor:pointer;box-shadow:0 8px 22px rgba(15,139,141,.22)}.mic.listening{animation:pulse 1.1s infinite}@keyframes pulse{50%{transform:scale(1.07)}}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#0f8b8d;color:#fff}.secondary{background:#e8f6f7;color:#0f7779}.status{text-align:center;font-size:12px;color:#718486;margin:8px 0;min-height:17px}.note{font-size:12px;color:#6c8082;background:#f3fafb;border:1px solid #dcebec;border-radius:12px;padding:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}.hero h1{font-size:25px}}</style></head><body><header class="top"><button class="back" onclick="location.href='features.html'">←</button><div class="brand"><img src="/icons/globedisc-icon-v2.svg"><div><strong>GlobeDisc</strong><small>Voice → Text</small></div></div></header><main><section class="hero"><div class="ey">AI TOOLS · VOICE</div><h1>Speak. Get text.</h1><p>Use your microphone to turn speech into editable text. No audio file upload is required.</p></section><section class="panel"><div class="grid"><div class="field"><label>Recognition language</label><select id="lang"><option value="en-IN">English (India)</option><option value="hi-IN">Hindi</option><option value="mr-IN">Marathi</option><option value="gu-IN">Gujarati</option><option value="te-IN">Telugu</option><option value="ta-IN">Tamil</option><option value="kn-IN">Kannada</option><option value="bn-IN">Bengali</option><option value="ur-IN">Urdu</option></select></div><div class="field"><label>Mode</label><select id="mode"><option>Continuous dictation</option><option>Short speech</option></select></div></div><div class="controls"><button class="mic" id="mic" aria-label="Start voice recognition">🎙️</button></div><div class="status" id="status">Tap the microphone to start.</div><textarea id="text" placeholder="Your speech will appear here…"></textarea><div class="actions"><button class="btn secondary" id="copy">Copy Text</button><button class="btn secondary" id="clear">Clear</button></div><p class="note">Voice recognition availability depends on your browser/device. Microphone permission may be required.</p></section></main><script>const $=id=>document.getElementById(id),Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech){$("status").textContent="Voice recognition is not supported in this browser. Try Chrome or a supported browser.";$("mic").disabled=true}else{let rec=null,listening=false;function start(){rec=new Speech();rec.lang=$("lang").value;rec.continuous=$("mode").value==="Continuous dictation";rec.interimResults=true;rec.maxAlternatives=1;rec.onstart=()=>{listening=true;$("mic").classList.add("listening");$("status").textContent="Listening… speak now."};rec.onresult=e=>{let finalText="";let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=t+" ";else interim+=t}if(finalText)$("text").value+=finalText;if(interim)$("status").textContent="Listening… "+interim}; rec.onerror=e=>{const messages={"not-allowed":"Microphone permission was denied. Please allow microphone access and try again.","audio-capture":"No microphone was found. Check your device microphone.","network":"Voice recognition needs a stable internet connection. Please try again.","no-speech":"I did not hear anything. Please try speaking again.","aborted":"Voice input stopped."};$("status").textContent=messages[e.error]||"Voice recognition could not start. Please try again."};rec.onend=()=>{listening=false;$("mic").classList.remove("listening");if($("status").textContent.startsWith("Listening"))$("status").textContent="Stopped. Tap the microphone to continue."};rec.start()}function stop(){if(rec)rec.stop()}$("mic").onclick=()=>listening?stop():start();$("lang").onchange=()=>{if(listening){stop();setTimeout(start,200)}}}$("copy").onclick=async()=>{const value=$("text").value;if(!value){$("status").textContent="There is no text to copy yet.";return}try{await navigator.clipboard.writeText(value);$("copy").textContent="Copied";$("status").textContent="Text copied to clipboard.";setTimeout(()=>$("copy").textContent="Copy Text",1200)}catch{$("status").textContent="Could not access the clipboard. Select the text and copy it manually."}};$("clear").onclick=()=>{$("text").value="";$("status").textContent="Tap the microphone to start."}</script></body></html>
