<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — Budget Planner</title><style>*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #dcebec;padding:12px 14px}.btn{border:0;border-radius:11px;padding:10px 13px;background:#e8f6f7;color:#0f7779;font-weight:700}.page{max-width:850px;margin:auto;padding:16px}.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.row{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #edf3f3}.total{font-size:20px;font-weight:800;margin-top:10px}input{width:100%;padding:10px;border:1px solid #cfe4e5;border-radius:10px;font:inherit}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><button class="btn" onclick="location.href='money-hub.html'">←</button> <b>GlobeDisc · Budget Planner</b></header><main class="page"><section class="panel"><h2>Track your budget</h2><div class="grid"><input id="name" placeholder="Expense name"><input id="amount" type="number" min="0" placeholder="Amount (₹)"></div><button class="btn" onclick="add()" style="margin-top:8px">Add expense</button></section><section class="panel"><div id="list"></div><div class="total">Total: ₹<span id="total">0</span></div><button class="btn" onclick="clearAll()" style="margin-top:9px">Clear all</button></section></main><script>const K="globedisc_budget";function get(){try{return JSON.parse(localStorage.getItem(K)||"[]")}catch{return[]}}function save(a){localStorage.setItem(K,JSON.stringify(a));render()}function add(){let n=name.value.trim(),a=Number(amount.value);if(!n||!a)return;let x=get();x.unshift({id:crypto.randomUUID(),n,a});save(x);name.value=amount.value=""}function del(id){save(get().filter(x=>x.id!==id))}function clearAll(){save([])}function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]))}function render(){let a=get();list.innerHTML=a.length?a.map(x=>`<div class="row"><span>${esc(x.n)}</span><span>₹${x.a.toLocaleString("en-IN")} <button class="btn" onclick="del('${x.id}')">×</button></span></div>`).join(""):"<p style='color:#718184'>No expenses added.</p>";total.textContent=a.reduce((s,x)=>s+x.a,0).toLocaleString("en-IN")}render()</script></body></html>
