<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — Weather</title><link rel="icon" href="/icons/globedisc-icon-v2.svg"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5fbfc;color:#102a2c}.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid #dceced;padding:12px 16px;display:flex;gap:12px;align-items:center}.back{border:0;background:#e8f6f7;color:#0f7779;border-radius:12px;width:42px;height:42px}.brand{display:flex;gap:9px;align-items:center}.brand img{width:36px}.brand small{display:block;color:#668184}main{max-width:850px;margin:auto;padding:20px 14px 55px}.hero,.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:18px;margin-bottom:14px}.hero{background:linear-gradient(135deg,#e9fbfb,#fff)}.ey{font-size:12px;color:#0f8587;font-weight:700}.hero h1{margin:5px 0;font-size:30px}.muted{color:#667b7e;font-size:13px}.search{display:flex;gap:8px;margin-top:14px}.search input{flex:1;border:1px solid #cfe4e5;border-radius:12px;padding:12px;font:inherit}.btn{border:0;border-radius:12px;padding:11px 14px;background:#0f8b8d;color:#fff;font-weight:700}.loc{margin-top:9px}.current{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font-size:42px;font-weight:800;color:#0f7779}.condition{font-weight:700;font-size:17px}.stat{background:#f5fbfc;border:1px solid #e1eeee;border-radius:13px;padding:12px}.forecast{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.day{background:#f5fbfc;border:1px solid #e1eeee;border-radius:13px;padding:10px;text-align:center}.day strong,.day span{display:block}.status{min-height:18px;font-size:12px;color:#718486;margin-top:8px}@media(max-width:600px){.current{grid-template-columns:1fr}.forecast{grid-template-columns:repeat(2,1fr)}} </style></head><body><header class="top"><button class="back" onclick="location.href='features.html'">←</button><div class="brand"><img src="/icons/globedisc-icon-v2.svg"><div><strong>GlobeDisc</strong><small>Weather</small></div></div></header><main><section class="hero"><div class="ey">GLOBEDISC · WEATHER</div><h1>Weather, wherever you are.</h1><p class="muted">Search a city or use your current location for live conditions and a 5-day forecast.</p><div class="search"><input id="city" placeholder="Search city e.g. Mumbai" autocomplete="off"><button class="btn" id="search"><i class="fas fa-search"></i></button></div><button class="btn" id="loc" style="margin-top:8px;background:#e8f6f7;color:#0f7779"><i class="fas fa-location-crosshairs"></i> Use my location</button><div class="status" id="status"></div></section><section class="panel" id="weather" style="display:none"><div class="current"><div><div id="temp" class="big"></div><div id="condition" class="condition"></div><div id="place" class="muted"></div></div><div class="stat"><div>Feels like <strong id="feels"></strong></div><div style="margin-top:8px">Humidity <strong id="humidity"></strong></div><div style="margin-top:8px">Wind <strong id="wind"></strong></div></div></div><h3>5-day forecast</h3><div class="forecast" id="forecast"></div></section></main><script>const $=id=>document.getElementById(id);const status=$("status");const code=c=>({0:"Clear sky",1:"Mainly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Rime fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",71:"Light snow",73:"Snow",75:"Heavy snow",80:"Rain showers",81:"Rain showers",82:"Heavy showers",95:"Thunderstorm",96:"Thunderstorm",99:"Thunderstorm"}[c]||"Weather conditions");function track(){try{const a=JSON.parse(localStorage.getItem("globedisc_recent_tools")||"[]");a.push({name:"Weather",at:Date.now()});localStorage.setItem("globedisc_recent_tools",JSON.stringify(a.slice(-30)))}catch{}}async function load(lat,lon,name){status.textContent="Loading weather…";try{const u="https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+"&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=5&timezone=auto";const r=await fetch(u);if(!r.ok)throw Error("Weather service unavailable");const x=await r.json();$("weather").style.display="block";$("temp").textContent=Math.round(x.current.temperature_2m)+"°C";$("condition").textContent=code(x.current.weather_code);$("place").textContent=name||"Current location";$("feels").textContent=Math.round(x.current.apparent_temperature)+"°C";$("humidity").textContent=Math.round(x.current.relative_humidity_2m)+"%";$("wind").textContent=Math.round(x.current.wind_speed_10m)+" km/h";$("forecast").innerHTML=x.daily.time.map((d,i)=>'<div class="day"><strong>'+new Date(d).toLocaleDateString(undefined,{weekday:"short"})+'</strong><span style="font-size:20px;margin:7px 0">'+Math.round(x.daily.temperature_2m_max[i])+'°</span><span class="muted">'+Math.round(x.daily.temperature_2m_min[i])+'° · '+code(x.daily.weather_code[i])+'</span></div>').join("");status.textContent="Updated just now.";track()}catch(e){status.textContent=e.message||"Could not load weather."}}async function city(){const q=$("city").value.trim();if(!q)return;status.textContent="Finding "+q+"…";try{const r=await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(q)+"&count=1&language=en&format=json");const x=await r.json();const p=x.results?.[0];if(!p)throw Error("City not found.");await load(p.latitude,p.longitude,[p.name,p.admin1,p.country].filter(Boolean).join(", "))}catch(e){status.textContent=e.message}}$("search").onclick=city;$("city").addEventListener("keydown",e=>{if(e.key==="Enter")city()});$("loc").onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>load(p.coords.latitude,p.coords.longitude,"Current location"),()=>status.textContent="Location permission was not available. Search your city instead."):status.textContent="Location is not supported by this browser.";city();</script></body></html>
