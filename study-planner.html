<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — Study Planner</title><style>*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #dcebec;padding:12px 14px}.btn{border:0;border-radius:11px;padding:10px 13px;background:#e8f6f7;color:#0f7779;font-weight:700}.page{max-width:900px;margin:auto;padding:16px}.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}input{width:100%;padding:10px;border:1px solid #cfe4e5;border-radius:10px;font:inherit}.task{display:flex;gap:8px;align-items:center;padding:10px;border:1px solid #dcebec;border-radius:12px;margin-top:7px}.task.done{text-decoration:line-through;opacity:.6}.date{font-size:12px;color:#718184}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><button class="btn" onclick="location.href='student-hub.html'">←</button> <b>GlobeDisc · Study Planner</b></header><main class="page"><section class="panel"><h2>Plan your study</h2><div class="grid"><input id="subject" placeholder="Subject / topic"><input id="mins" type="number" min="10" placeholder="Minutes"></div><button class="btn" onclick="add()" style="margin-top:8px">Add study task</button></section><section class="panel"><h3>Today</h3><div id="list"></div><button class="btn" onclick="clearDone()" style="margin-top:9px">Clear completed</button></section></main><script>const K="globedisc_study_plan";function get(){try{return JSON.parse(localStorage.getItem(K)||"[]")}catch{return[]}}function save(a){localStorage.setItem(K,JSON.stringify(a));render()}function add(){let s=subject.value.trim(),m=Number(mins.value)||25;if(!s)return;let a=get();a.push({id:crypto.randomUUID(),s,m,done:false});save(a);subject.value="";mins.value=""}function toggle(id){let a=get(),x=a.find(x=>x.id===id);if(x)x.done=!x.done;save(a)}function del(id){save(get().filter(x=>x.id!==id))}function clearDone(){save(get().filter(x=>!x.done))}function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]))}function render(){let a=get();list.innerHTML=a.length?a.map(x=>`<div class="task ${x.done?"done":""}"><input type="checkbox" ${x.done?"checked":""} onchange="toggle('${x.id}')"><div style="flex:1"><b>${esc(x.s)}</b><div class="date">${x.m} minutes</div></div><button class="btn" onclick="del('${x.id}')">×</button></div>`).join(""):"<p class='date'>No study tasks yet.</p>"}render()</script></body></html>
