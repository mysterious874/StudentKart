<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — Timetable</title><link rel="icon" href="/icons/globedisc-icon-v2.svg"><style>*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #dcebec;padding:12px;display:flex;gap:10px;align-items:center}.top button,.btn{border:0;border-radius:12px;padding:10px 14px;background:#e8f6f7;color:#0f7779;font-weight:700}.top h2{margin:0}.wrap{max-width:850px;margin:auto;padding:18px 14px}.hero,.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:18px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#e9fbfb,#fff)}.form{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:7px}input,select{width:100%;padding:11px;border:1px solid #cfe4e5;border-radius:12px;font:inherit}.btn{cursor:pointer}.row{display:grid;grid-template-columns:100px 1fr 90px auto;gap:8px;align-items:center;padding:10px;border-bottom:1px solid #edf4f4}.row:last-child{border-bottom:0}.muted{color:#637779;font-size:12px}@media(max-width:650px){.form{grid-template-columns:1fr 1fr}.form .btn{grid-column:1/-1}.row{grid-template-columns:1fr 1fr}.row button{grid-column:2}} </style></head><body><header class="top"><button onclick="history.back()">←</button><h2>📅 Timetable</h2></header><main class="wrap"><section class="hero"><h1>Your study timetable</h1><p>Add subjects and time slots. Your schedule stays on this device.</p></section><section class="panel"><div class=form><select id=day><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option></select><input id=time type=time><input id=sub placeholder="Subject / activity"><button class=btn onclick=add()>Add</button></div></section><section class=panel id=list></section></main><script>const key="globedisc_timetable";function get(){return JSON.parse(localStorage.getItem(key)||"[]")}function add(){const a=get(),d=day.value,t=time.value,s=sub.value.trim();if(!t||!s)return;a.push({d,t,s});a.sort((x,y)=>["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"].indexOf(x.d)-["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"].indexOf(y.d)||x.t.localeCompare(y.t));localStorage.setItem(key,JSON.stringify(a));sub.value="";render()}function del(i){const a=get();a.splice(i,1);localStorage.setItem(key,JSON.stringify(a));render()}function render(){const a=get();list.innerHTML=a.length?a.map((x,i)=>'<div class=row><strong>'+x.d+'</strong><span>'+x.s+'</span><span>'+x.t+'</span><button class=btn onclick=del('+i+')>Delete</button></div>').join(""):"<span class=muted>No timetable entries yet.</span>"}render();</script></body></html>
