<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — Student Hub</title><link rel="icon" href="/icons/globedisc-icon-v2.svg"><style>body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui}.top,main{max-width:900px;margin:auto}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #dcebec;padding:12px}.top button,.btn{border:0;border-radius:12px;padding:10px 14px;background:#e8f6f7;color:#0f7779;font-weight:700}.top h2{display:inline;margin-left:10px}main{padding:18px 14px}.hero,.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:18px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#e9fbfb,#fff)}h1{margin:4px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{border:1px solid #dcebec;border-radius:14px;padding:14px;background:#fbfefe}.card h3{margin:0 0 6px}.card p{color:#637779;font-size:12px}.card button{margin-top:5px}.tool{display:none}.tool.active{display:block}input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cfe4e5;border-radius:12px;margin:6px 0;font:inherit}textarea{min-height:140px}.out{white-space:pre-wrap;background:#f7fcfc;border:1px solid #dcebec;border-radius:12px;padding:12px;margin-top:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><button onclick="location.href='features.html'">←</button><h2>🎓 GlobeDisc Student Hub</h2></header><main><section class="hero"><h1>Study smarter</h1><p>Quick tools for doubts, quizzes, flashcards, coding practice and exam planning.</p></section><section class="panel"><div class="grid" id="cards"></div></section><section class="panel"><div id="tool"></div></section></main><script>const tools=[["PDF / Document Search","Search the web for a document or PDF","pdf"],["AI Doubt Solver","Explain any study doubt","doubt"],["MCQ Generator","Generate practice MCQs","mcq"],["Quiz","Create a quick quiz","quiz"],["Flashcards","Turn a topic into flashcards","flash"],["Coding Practice","Generate coding practice","code"],["DSA Practice","Practice DSA questions","dsa"],["Cybersecurity Learning","Get a cybersecurity learning path","cyber"],["Exam Countdown","Set an exam date","exam"],["Timetable","Create a study timetable","time"]];const cards=document.getElementById("cards"),tool=document.getElementById("tool");cards.innerHTML=tools.map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p><button class="btn" onclick="openTool('${x[2]}')">Open</button></div>`).join("");function openTool(type){tool.innerHTML=`<h3>${tools.find(x=>x[2]===type)[0]}</h3><textarea id="q" placeholder="Enter topic, question, syllabus, date or requirements…"></textarea><button class="btn" onclick="run('${type}')">Continue</button><div id="out" class="out" style="display:none"></div>`;tool.className="tool active";tool.scrollIntoView({behavior:"smooth"})}async function run(type){const q=document.getElementById("q").value.trim();if(!q)return;let prompt=`You are GlobeDisc Student Hub. Tool: ${type}. User input: ${q}. Give a useful practical result for a student. For PDF/document search, provide focused search queries and useful source types; for exam countdown/timetable, calculate or structure from supplied dates/times; for MCQ/quiz/flashcards/coding/DSA, generate usable practice content; for cybersecurity, give a safe learning path. Do not invent personal facts.`;const out=document.getElementById("out");out.style.display="block";out.textContent="Working…";try{const r=await fetch("https://yymzfjfkmsrymqhpnfqz.supabase.co/functions/v1/ai-chat",{method:"POST",headers:{apikey:"sb_publishable_tEePI-aSGDkt_2S6oiEfPw_Hy_mEXkw",Authorization:"Bearer sb_publishable_tEePI-aSGDkt_2S6oiEfPw_Hy_mEXkw","Content-Type":"application/json"},body:JSON.stringify({question:prompt,history:[],research:false})});const x=await r.json();out.textContent=x.answer||x.response||x.text||x.message||"No result."}catch(e){out.textContent="Could not complete this request."}}</script></body></html>
