<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — PDF Summarizer</title>
<link rel="icon" type="image/svg+xml" href="/icons/globedisc-icon-v2.svg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-bottom:1px solid #dceced;padding:12px 16px;display:flex;align-items:center;gap:12px}.back{border:0;background:#e8f6f7;border-radius:12px;width:42px;height:42px;color:#0f7779}.brand{display:flex;align-items:center;gap:9px}.brand img{width:36px;height:36px}.brand small{display:block;color:#668184}
main{max-width:760px;margin:auto;padding:20px 14px 40px}.hero,.panel{background:#fff;border:1px solid #dcebec;border-radius:20px;padding:18px;box-shadow:0 8px 24px rgba(10,70,72,.06)}.hero{background:linear-gradient(135deg,#e9fbfb,#fff);margin-bottom:14px}.hero h1{margin:6px 0;font-size:28px}.hero p{margin:5px 0;color:#647679;font-size:14px}.drop{border:2px dashed #b9d9da;border-radius:17px;padding:25px 15px;text-align:center;cursor:pointer;background:#fbfefe}.drop.drag{border-color:#0f8b8d;background:#effafa}.drop i{font-size:32px;color:#0f8b8d}.drop strong{display:block;margin-top:9px}.drop small{color:#718184}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:12px;padding:11px 15px;background:#0f8b8d;color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#e8f6f7;color:#0f7779}.btn:disabled{opacity:.55;cursor:not-allowed}.status{margin-top:12px;color:#647679;font-size:13px}.result{white-space:pre-wrap;line-height:1.55;font-size:14px}.hidden{display:none!important}.meta{font-size:12px;color:#718184;margin-top:8px}
</style></head>
<body><script>
(function(){try{const a=JSON.parse(localStorage.getItem("globedisc_recent_tools")||"[]");a.push({name:"PDF Summarizer",at:Date.now()});localStorage.setItem("globedisc_recent_tools",JSON.stringify(a.slice(-30)))}catch{}})();
</script>
<header class="top"><button class="back" id="back"><i class="fas fa-arrow-left">‹</i></button><div class="brand"><img src="/icons/globedisc-icon-v2.svg"><div><strong>GlobeDisc</strong><small>PDF Summarizer</small></div></div></header>
<main>
<section class="hero"><span style="font-size:12px;color:#0f8587;font-weight:700">AI TOOL</span><h1>Summarize any PDF</h1><p>Upload a PDF and GlobeDisc AI will extract its text and create a clear summary.</p></section>
<section class="panel">
<label class="drop" id="drop"><i class="fas fa-file-pdf"></i><strong>Choose a PDF</strong><small>Tap here or drag & drop • text PDFs work best</small><input id="file" type="file" accept="application/pdf,.pdf" hidden></label>
<div class="row"><button class="btn" id="summarize" disabled>✨ Summarize PDF</button><button class="btn secondary hidden" id="clear">Clear</button></div>
<div class="status" id="status">No PDF selected.</div><div class="meta" id="meta"></div>
</section>
<section class="panel hidden" id="resultPanel" style="margin-top:14px"><strong>AI Summary</strong><div class="result" id="result" style="margin-top:10px"></div></section>
</main>
<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";
const SUPABASE_URL="https://yymzfjfkmsrymqhpnfqz.supabase.co";
const SUPABASE_KEY="sb_publishable_tEePI-aSGDkt_2S6oiEfPw_Hy_mEXkw";
const $=id=>document.getElementById(id);
let selected=null,textContent="";
$("back").onclick=()=>location.href="features.html";
$("drop").onclick=()=>$("file").click();
$("file").onchange=e=>pick(e.target.files?.[0]);
["dragenter","dragover"].forEach(ev=>$("drop").addEventListener(ev,e=>{e.preventDefault();$("drop").classList.add("drag")}));
["dragleave","drop"].forEach(ev=>$("drop").addEventListener(ev,e=>{e.preventDefault();$("drop").classList.remove("drag")}));
$("drop").addEventListener("drop",e=>pick(e.dataTransfer.files?.[0]));
async function pick(file){
 if(!file)return;
 if(file.type!=="application/pdf"&&!file.name.toLowerCase().endsWith(".pdf")){setStatus("Please select a PDF file.");return}
 if(file.size>20*1024*1024){setStatus("PDF is too large. Maximum size is 20 MB.");return}
 selected=file;textContent="";$("summarize").disabled=true;$("clear").classList.remove("hidden");$("resultPanel").classList.add("hidden");
 try{
  setStatus("Reading PDF…");
  const data=await file.arrayBuffer(),pdf=await pdfjsLib.getDocument({data}).promise;
  const pages=[];let chars=0;
  for(let n=1;n<=pdf.numPages;n++){
   const page=await pdf.getPage(n),tc=await page.getTextContent();
   const t=tc.items.map(x=>x.str||"").join(" ").replace(/\s+/g," ").trim();
   if(t)pages.push("Page "+n+": "+t);
   chars+=t.length;
   setStatus("Reading page "+n+" of "+pdf.numPages+"…");
  }
  textContent=pages.join("\n\n");
  if(!textContent){setStatus("No selectable text found. This PDF may be scanned/image-only.");return}
  if(textContent.length>60000)textContent=textContent.slice(0,60000)+"\n\n[Text truncated after 60,000 characters.]";
  $("meta").textContent=pdf.numPages+" pages • "+Math.round(file.size/1024)+" KB • "+textContent.length.toLocaleString()+" characters extracted";
  setStatus("PDF ready. Tap Summarize PDF.");
  $("summarize").disabled=false;
 }catch(e){console.error(e);setStatus("Could not read this PDF. Please try another file.");}
}
$("summarize").onclick=async()=>{
 if(!textContent)return;
 $("summarize").disabled=true;$("resultPanel").classList.remove("hidden");$("result").textContent="Thinking…";setStatus("Generating AI summary…");
 try{
  const prompt="Summarize the following PDF for the user. Give: 1) a short overview, 2) key points, 3) important facts/numbers, and 4) a simple conclusion. Preserve important caveats. Use clear headings and concise bullets. If the document is academic, explain difficult terms simply.\n\nPDF TEXT:\n"+textContent;
  const response=await fetch(SUPABASE_URL+"/functions/v1/ai-chat",{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({question:prompt,history:[],research:false})});
  const data=await response.json().catch(()=>({}));
  if(!response.ok||!data.answer)throw new Error(data.error||"AI service unavailable");
  $("result").textContent=data.answer;setStatus("Summary ready.");
 }catch(e){$("result").textContent="Could not generate the summary. Please try again.";setStatus(e.message||"AI service unavailable.");}
 finally{$("summarize").disabled=false}
};
$("clear").onclick=()=>{selected=null;textContent="";$("file").value="";$("summarize").disabled=true;$("clear").classList.add("hidden");$("resultPanel").classList.add("hidden");$("meta").textContent="";setStatus("No PDF selected.")};
function setStatus(t){$("status").textContent=t}
</script>
</body></html>
