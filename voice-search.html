<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — Voice Search</title><link rel="icon" href="/icons/globedisc-icon-v2.svg"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5fbfc;color:#102a2c}.top{padding:12px 16px;background:rgba(255,255,255,.94);border-bottom:1px solid #dceced;display:flex;gap:12px;align-items:center;position:sticky;top:0}.back{border:0;background:#e8f6f7;border-radius:12px;width:42px;height:42px;color:#0f7779}.brand{display:flex;gap:9px;align-items:center}.brand img{width:36px}.brand small{display:block;color:#668184}main{max-width:700px;margin:auto;padding:24px 16px}.box{background:#fff;border:1px solid #dcebec;border-radius:20px;padding:22px;text-align:center}.mic{width:82px;height:82px;border-radius:50%;border:0;background:#e8f7f7;color:#0f8587;font-size:30px;margin:16px}.mic.listening{box-shadow:0 0 0 8px #dff4f4}.input{width:100%;padding:14px;border:1px solid #cfe4e5;border-radius:13px;font-size:16px}.btn{border:0;border-radius:12px;padding:12px 16px;background:#0f8b8d;color:#fff;font-weight:700;margin-top:10px}.muted{color:#6b7f81;font-size:13px}.status{min-height:20px;margin:10px}.langs{padding:11px;border:1px solid #cfe4e5;border-radius:12px;background:#fff}</style></head><body><header class="top"><button class="back" onclick="location.href='features.html'">←</button><div class="brand"><img src="/icons/globedisc-icon-v2.svg"><div><strong>GlobeDisc</strong><small>Voice Search</small></div></div></header><main><div class="box"><span class="muted">SEARCH WITHOUT TYPING</span><h1>Speak to GlobeDisc</h1><p class="muted">Tap the microphone, say what you need, then search.</p><select id="lang" class="langs"><option value="en-IN">English (India)</option><option value="hi-IN">Hindi</option><option value="mr-IN">Marathi</option><option value="gu-IN">Gujarati</option><option value="te-IN">Telugu</option><option value="ta-IN">Tamil</option><option value="kn-IN">Kannada</option><option value="bn-IN">Bengali</option><option value="ur-IN">Urdu</option></select><br><button id="mic" class="mic" aria-label="Start voice search">🎙️</button><div id="status" class="status muted">Ready</div><input id="query" class="input" placeholder="Your voice query will appear here"><br><button class="btn" onclick="goSearch()">Search GlobeDisc</button><div id="actions" style="display:none;margin-top:14px;text-align:left"><div class="muted" style="margin-bottom:8px">Use this query with:</div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px"><button class="btn" style="margin:0;background:#e8f6f7;color:#0f7779" onclick="useWith('ai')">Ask AI</button><button class="btn" style="margin:0;background:#e8f6f7;color:#0f7779" onclick="useWith('translate')">Translate</button><button class="btn" style="margin:0;background:#e8f6f7;color:#0f7779" onclick="useWith('study')">Study</button><button class="btn" style="margin:0;background:#e8f6f7;color:#0f7779" onclick="useWith('jobs')">Jobs</button></div></div></div></main><script>const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;const mic=document.getElementById('mic'),status=document.getElementById('status'),q=document.getElementById('query');if(!SpeechRecognition){status.textContent='Voice recognition is not supported in this browser. You can type instead.';mic.disabled=true}else{const r=new SpeechRecognition();r.interimResults=true;r.continuous=false;mic.onclick=()=>{r.lang=document.getElementById('lang').value;r.start();mic.classList.add('listening');status.textContent='Listening…'};r.onresult=e=>{let s='';for(const x of e.results)s+=x[0].transcript;q.value=s};r.onerror=e=>{status.textContent='Could not hear that. Try again.';mic.classList.remove('listening')};r.onend=()=>{mic.classList.remove('listening');status.textContent=q.value?'Ready to search':'Ready'}}function showActions(){document.getElementById('actions').style.display=q.value.trim()?'block':'none'};q.addEventListener('input',showActions);function goSearch(){const v=q.value.trim();if(!v)return;try{localStorage.setItem('globedisc_pending_search',v);const a=JSON.parse(localStorage.getItem('globedisc_search_history')||'[]');a.push(v);localStorage.setItem('globedisc_search_history',JSON.stringify(a.slice(-50)))}catch{}location.href='index.html?search='+encodeURIComponent(v)}function useWith(type){const v=q.value.trim();if(!v)return;try{localStorage.setItem('globedisc_pending_search',v)}catch{}if(type==='ai')location.href='index.html#aiAssistantPage';else if(type==='translate')location.href='translator.html?text='+encodeURIComponent(v);else if(type==='study')location.href='student-hub.html?query='+encodeURIComponent(v);else if(type==='jobs')location.href='career-hub.html?query='+encodeURIComponent(v)}</script></body></html>
