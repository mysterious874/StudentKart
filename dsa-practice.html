<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=theme-color content=#0f8b8d><title>GlobeDisc — DSA Practice</title><style>*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui}.top{background:#fff;border-bottom:1px solid #dcebec;padding:12px}.btn{border:0;border-radius:12px;padding:10px 14px;background:#e8f6f7;color:#0f7779;font-weight:700}.wrap{max-width:760px;margin:auto;padding:18px 14px}.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:18px;margin-bottom:12px}.q{padding:14px;border:1px solid #dcebec;border-radius:14px;margin:10px 0}label{display:block;padding:9px;border:1px solid #dcebec;border-radius:10px;margin:6px 0}.score{font-size:21px;font-weight:800;color:#0f8587}</style></head><body><header class=top><button class=btn onclick=history.back()>←</button> <b>GlobeDisc · DSA Practice</b></header><main class=wrap><section class=panel><h2>DSA Practice</h2><p>Quick fundamentals practice.</p><div id=q></div><button class=btn onclick=finish()>Submit</button><p id=out></p></section></main><script>const qs=[["Which data structure follows LIFO?",["Queue","Stack","Array","Graph"],1],["Binary search requires data to be?",["Random","Sorted","Encrypted","Duplicated"],1],["Which is commonly O(1) average lookup?",["Hash table","Bubble sort","Linear search","Selection sort"],0],["BFS commonly uses a?",["Stack","Queue","Heap only","Tree"],1],["What does Big-O describe?",["Color","Growth of complexity","Syntax","File size"],1]];q.innerHTML=qs.map((x,i)=>'<div class=q><b>'+(i+1)+'. '+x[0]+'</b>'+x[1].map((o,j)=>'<label><input type=radio name=q'+i+' value='+j+'> '+o+'</label>').join("")+'</div>').join("");function finish(){let s=qs.reduce((a,x,i)=>a+(document.querySelector('input[name=q'+i+']:checked')?.value==x[1]?1:0),0);out.className='score';out.textContent='Score: '+s+' / '+qs.length}</script></body></html>
