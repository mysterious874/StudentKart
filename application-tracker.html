<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — Application Tracker</title><style>*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui}.top{background:#fff;border-bottom:1px solid #dcebec;padding:12px 14px;position:sticky;top:0}.btn{border:0;border-radius:11px;padding:10px 13px;background:#e8f6f7;color:#0f7779;font-weight:700}.page{max-width:850px;margin:auto;padding:16px}.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:7px}input,select{width:100%;padding:10px;border:1px solid #cfe4e5;border-radius:10px;font:inherit}.item{padding:12px;border:1px solid #dcebec;border-radius:13px;margin-top:8px;display:flex;justify-content:space-between;gap:8px;align-items:center}.meta{color:#6b7d7f;font-size:12px}.danger{background:#fff0f0;color:#a33}@media(max-width:650px){.grid{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}}</style></head><body><header class="top"><button class="btn" onclick="location.href='jobs-hub.html'">←</button> <b>GlobeDisc · Application Tracker</b></header><main class="page"><section class="panel"><h2>Track applications</h2><div class="grid"><input id="company" placeholder="Company / organization"><input id="role" placeholder="Role"><select id="status"><option>Applied</option><option>Screening</option><option>Interview</option><option>Offer</option><option>Rejected</option></select></div><input id="date" type="date" style="margin-top:7px"><button class="btn" onclick="add()" style="margin-top:7px">Add application</button></section><section class="panel"><div id="list"></div></section></main><script>const K="globedisc_applications";function get(){try{return JSON.parse(localStorage.getItem(K)||"[]")}catch{return[]}}function save(a){localStorage.setItem(K,JSON.stringify(a));render()}function add(){const c=company.value.trim(),r=role.value.trim();if(!c||!r)return;const a=get();a.unshift({id:crypto.randomUUID(),company:c,role:r,status:status.value,date:date.value});save(a);company.value=role.value=date.value=""}function del(id){save(get().filter(x=>x.id!==id))}function change(id,v){const a=get();const x=a.find(x=>x.id===id);if(x)x.status=v;save(a)}function render(){const a=get();list.innerHTML=a.length?a.map(x=>`<div class="item"><div><b>${esc(x.role)}</b><div class="meta">${esc(x.company)} · ${x.date||"No date"}</div></div><select onchange="change('${x.id}',this.value)"><option ${x.status==="Applied"?"selected":""}>Applied</option><option ${x.status==="Screening"?"selected":""}>Screening</option><option ${x.status==="Interview"?"selected":""}>Interview</option><option ${x.status==="Offer"?"selected":""}>Offer</option><option ${x.status==="Rejected"?"selected":""}>Rejected</option></select><button class="btn danger" onclick="del('${x.id}')">Delete</button></div>`).join(""):"<p class='meta'>No applications yet.</p>"}function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]))}render()</script></body></html>
