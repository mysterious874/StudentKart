name: Banjara Connect checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          for f in *.js; do
            echo "Checking $f"
            node --check "$f"
          done
