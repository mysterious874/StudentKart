<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — Travel Checklist</title><style>*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #dcebec;padding:12px 14px}.btn{border:0;border-radius:11px;padding:10px 13px;background:#e8f6f7;color:#0f7779;font-weight:700}.page{max-width:850px;margin:auto;padding:16px}.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.item{display:flex;gap:9px;align-items:center;padding:10px;border:1px solid #dcebec;border-radius:11px;margin-top:7px}.item.done{opacity:.55;text-decoration:line-through}input[type=text]{width:100%;padding:10px;border:1px solid #cfe4e5;border-radius:10px;font:inherit}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><button class="btn" onclick="location.href='travel.html'">←</button> <b>GlobeDisc · Travel Checklist</b></header><main class="page"><section class="panel"><h2>Pack smarter</h2><div class="grid"><input id="item" placeholder="Add an item, e.g. charger"><button class="btn" onclick="add()">Add item</button></div></section><section class="panel"><div id="list"></div><button class="btn" onclick="resetList()" style="margin-top:9px">Reset checklist</button></section></main><script>const K="globedisc_travel_checklist";const defaults=["Passport / ID","Wallet","Phone + charger","Power bank","Medicines","Clothes","Toiletries","Travel tickets","Hotel booking","Emergency contacts"];function get(){try{let a=JSON.parse(localStorage.getItem(K));return Array.isArray(a)&&a.length?a:defaults.map(t=>({t,d:false}))}catch{return defaults.map(t=>({t,d:false}))}}function save(a){localStorage.setItem(K,JSON.stringify(a));render()}function add(){let t=item.value.trim();if(!t)return;let a=get();a.push({t,d:false});save(a);item.value=""}function tog(i){let a=get();a[i].d=!a[i].d;save(a)}function resetList(){localStorage.removeItem(K);render()}function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]))}function render(){let a=get();list.innerHTML=a.map((x,i)=>`<label class="item ${x.d?"done":""}"><input type="checkbox" ${x.d?"checked":""} onchange="tog(${i})"> ${esc(x.t)}</label>`).join("")}render()</script></body></html>
