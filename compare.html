<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — Compare</title><link rel="icon" href="/icons/globedisc-icon-v2.svg"><style>*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.top{position:sticky;top:0;z-index:4;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid #dcebec;padding:12px 14px;display:flex;align-items:center;gap:10px}.top button{border:0;border-radius:12px;padding:10px 13px;background:#e8f6f7;color:#0f7779}.brand img{width:32px;vertical-align:middle}.brand strong{margin-left:7px}.brand small{display:block;margin-left:39px;color:#668184}main{max-width:950px;margin:auto;padding:18px 14px 55px}.hero,.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:18px;margin-bottom:13px}.hero{background:linear-gradient(135deg,#e9fbfb,#fff)}.search{display:flex;gap:8px;margin-top:13px}.search input{flex:1;border:1px solid #cfe4e5;border-radius:12px;padding:12px;font:inherit}.btn{border:0;border-radius:12px;padding:11px 14px;background:#0f8b8d;color:#fff;font-weight:700}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.chip{background:#e8f6f7;border:1px solid #cfe4e5;border-radius:20px;padding:7px 10px;cursor:pointer}.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.item{border:1px solid #dcebec;border-radius:15px;padding:14px;background:#fff}.item h3{margin:0 0 10px}.remove{float:right;border:0;background:#f0f7f7;border-radius:9px;padding:5px 8px;color:#0f7779}.row{display:grid;grid-template-columns:150px 1fr;gap:8px;padding:9px 0;border-top:1px solid #edf3f3}.key{color:#6a7d7f;font-size:12px}.value{font-weight:650;overflow-wrap:anywhere}.hint{color:#667b7e;font-size:12px;margin-top:8px}.empty{text-align:center;color:#718486;padding:25px}@media(max-width:650px){.compare{grid-template-columns:1fr}.row{grid-template-columns:110px 1fr}}</style></head><body><header class="top"><button onclick="location.href='features.html'">←</button><div class="brand"><img src="/icons/globedisc-icon-v2.svg"><strong>GlobeDisc</strong><small>Compare Mode</small></div></header><main><section class="hero"><b style="color:#0f8587">GLOBEDISC · COMPARE</b><h1>Compare before you choose.</h1><p class="hint">Add up to two items and compare their details side-by-side. Great for phones, laptops, products, plans and more.</p><div class="search"><input id="q" placeholder="Add an item e.g. iPhone 16"><button class="btn" id="add">Add</button></div><div class="chips"><button class="chip" onclick="quick('iPhone 16')">iPhone 16</button><button class="chip" onclick="quick('Samsung Galaxy S25')">Galaxy S25</button><button class="chip" onclick="quick('MacBook Air M4')">MacBook Air M4</button></div></section><section class="panel"><div id="compare" class="compare"></div><div id="empty" class="empty">Add two items to start comparing.</div></section></main><script>const items=[];const compare=document.getElementById("compare"),empty=document.getElementById("empty");function quick(x){document.getElementById("q").value=x;add()}function add(){const v=document.getElementById("q").value.trim();if(!v||items.some(x=>x.toLowerCase()===v.toLowerCase())||items.length>=2)return;if(items.length<2){items.push(v);document.getElementById("q").value="";render()}}document.getElementById("add").onclick=add;document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter")add()});function remove(i){items.splice(i,1);render()}function render(){empty.style.display=items.length?"none":"block";compare.innerHTML=items.map((x,i)=>'<article class="item"><button class="remove" onclick="remove('+i+')">Remove</button><h3>'+esc(x)+'</h3><div class="row"><span class="key">Search</span><span class="value"><button class="chip" onclick="searchItem('+i+')">Find details</button></span></div><div class="row"><span class="key">Compare</span><span class="value">'+(items.length===2?"Side-by-side ready":"Waiting for another item")+'</span></div><div class="row"><span class="key">GlobeDisc</span><span class="value">Universal Search</span></div></article>').join("");if(items.length===2)renderDiff()}function renderDiff(){const p=document.createElement("div");p.className="panel";p.style.gridColumn="1/-1";p.innerHTML='<h3>Comparison</h3><div class="row"><span class="key">Item 1</span><span class="value">'+esc(items[0])+'</span></div><div class="row"><span class="key">Item 2</span><span class="value">'+esc(items[1])+'</span></div><p class="hint">Use “Find details” on each item to open GlobeDisc Search and compare specs, price, reviews and news from the result pages.</p>';compare.appendChild(p)}function searchItem(i){location.href="index.html?search="+encodeURIComponent(items[i])}function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}try{const a=JSON.parse(localStorage.getItem("globedisc_recent_tools")||"[]");a.push({name:"Compare Mode",at:Date.now()});localStorage.setItem("globedisc_recent_tools",JSON.stringify(a.slice(-30)))}catch{}</script></body></html>
