<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — Resume Builder</title><link rel="icon" href="/icons/globedisc-icon-v2.svg"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5fbfc;color:#102a2c}.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid #dceced;padding:12px 16px;display:flex;align-items:center;gap:12px}.back{border:0;background:#e8f6f7;border-radius:12px;width:42px;height:42px;color:#0f7779;font-size:16px}.brand{display:flex;gap:9px;align-items:center}.brand img{width:36px;height:36px}.brand strong{display:block}.brand small{color:#668184}main{max-width:900px;margin:auto;padding:20px 14px 50px}.hero,.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:18px;margin-bottom:14px}.hero{background:linear-gradient(135deg,#e9fbfb,#fff);border-color:#d7eeee}.ey{font-size:12px;color:#0f8587;font-weight:700}.hero h1{margin:5px 0;font-size:28px}.hero p{margin:7px 0;color:#607477;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:12px}label{display:block;font-size:12px;font-weight:700;color:#557174;margin-bottom:7px}input,textarea,select{width:100%;border:1px solid #cfe4e5;border-radius:12px;background:#fbfefe;color:#17383b;padding:11px 12px;font:inherit}textarea{min-height:100px;resize:vertical}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#0f8b8d;color:#fff}.secondary{background:#e8f6f7;color:#0f7779}.status{font-size:12px;color:#718486;margin-top:9px;min-height:17px}.result{display:none;margin-top:14px;border:1px solid #dcebec;border-radius:14px;overflow:hidden}.rhead{display:flex;justify-content:space-betwee </script><header class="top"><button class="back" onclick="location.href='features.html'">←</button><div class="brand"><img src="/icons/globedisc-icon-v2.svg"><div><strong>GlobeDisc</strong><small>Resume Builder</small></div></div></header><main><section class="hero"><div class="ey">AI TOOLS · RESUME BUILDER</div><h1>Build a professional resume</h1><p>Enter your details and GlobeDisc AI will turn them into a clean, ATS-friendly resume.</p></section><section class="panel"><div class="grid"><div class="field"><label>Full name</label><input id="name" placeholder="Your name"></div><div class="field"><label>Target role</label><input id="role" placeholder="e.g. Cybersecurity Intern"></div><div class="field"><label>Education</label><textarea id="edu" placeholder="Degree, college, year, CGPA/percentage"></textarea></div><div class="field"><label>Skills</label><textarea id="skills" placeholder="Python, networking, Linux..."></textarea></div><div class="field full"><label>Experience / internships</label><textarea id="exp" placeholder="Company, role, dates, responsibilities and achievements. Write N/A if none."></textarea></div><div class="field full"><label>Projects</label><textarea id="projects" placeholder="Project name, technologies used and what you built."></textarea></div><div class="field full"><label>Certifications / achievements</label><textarea id="ach" placeholder="Certifications, awards, hackathons, activities..."></textarea></div><div class="field full"><label>Additional information</label><textarea id="extra" placeholder="Location, languages, portfolio/GitHub/LinkedIn, or anything else to include."></textarea></div></div><div class="actions"><button class="btn primary" id="build">Build Resume</button><button class="btn secondary" id="clear">Clear</button></div><div class="status" id="status"></div><div class="result" id="result"><div class="rhead"><span>Generated Resume</span><button class="btn secondary" id="copy" style="padding:7px 10px;font-size:12px">Copy</button></div><pre id="answer"></pre></div></section></main><script>const URL="https://yymzfjfkmsrymqhpnfqz.supabase.co",KEY="sb_publishable_tEePI-aSGDkt_2S6oiEfPw_Hy_mEXkw",$=id=>document.getElementById(id);async function build(){const name=$("name").value.trim(),role=$("role").value.trim();if(!name||!role){$("status").textContent="Add your name and target role first.";return}const q=`Create a professional, ATS-friendly resume for this candidate. Return a polished resume in plain text with clear headings: SUMMARY, SKILLS, EXPERIENCE, PROJECTS, EDUCATION, CERTIFICATIONS & ACHIEVEMENTS, and ADDITIONAL INFORMATION where applicable. Do not invent facts. If a section has no data, omit it. Keep wording concise and achievement-focused. Target role: ${role}. Candidate name: ${name}. Education: ${$("edu").value}. Skills: ${$("skills").value}. Experience: ${$("exp").value}. Projects: ${$("projects").value}. Certifications/achievements: ${$("ach").value}. Additional information: ${$("extra").value}.`;$("build").disabled=true;$("status").textContent="Building resume…";$("result").style.display="none";try{const r=await fetch(URL+"/functions/v1/ai-chat",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({question:q,history:[],research:false})});const d=await r.json();if(!r.ok)throw Error(d?.error||d?.message||"AI request failed");$("answer").textContent=d.answer||d.response||d.text||d.message||"No resume returned.";$("result").style.display="block";$("status").textContent="Resume ready."}catch(e){$("status").textContent="Could not build resume. "+e.message}finally{$("build").disabled=false}}$("build").onclick=build;$("clear").onclick=()=>{document.querySelectorAll("input,textarea").forEach(x=>x.value="");$("answer").textContent="";$("result").style.display="none";$("status").textContent=""};$("copy").onclick=async()=>{await navigator.clipboard.writeText($("answer").textContent);$("status").textContent="Resume copied."}</script></body></html>
