<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=theme-color content=#0f8b8d><title>GlobeDisc — Stopwatch & Timer</title><style>*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui}.top{background:#fff;border-bottom:1px solid #dcebec;padding:12px}.btn{border:0;border-radius:12px;padding:10px 14px;background:#e8f6f7;color:#0f7779;font-weight:700}.wrap{max-width:650px;margin:auto;padding:18px 14px}.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:20px;margin-bottom:12px;text-align:center}.time{font-size:42px;font-weight:800;margin:20px 0}input{padding:11px;border:1px solid #cfe4e5;border-radius:11px;width:120px}</style></head><body><header class=top><button class=btn onclick=history.back()>←</button> <b>GlobeDisc · Stopwatch & Timer</b></header><main class=wrap><section class=panel><h3>Stopwatch</h3><div id=sw class=time>00:00:00</div><button class=btn onclick=startSw()>Start</button> <button class=btn onclick=stopSw()>Stop</button> <button class=btn onclick=resetSw()>Reset</button></section><section class=panel><h3>Countdown Timer</h3><input id=min type=number min=1 value=5> minutes<br><div id=tm class=time>05:00</div><button class=btn onclick=startTm()>Start Timer</button><button class=btn onclick=resetTm()>Reset</button></section></main><script>let si=0,st,ti=300,tt;function fmt(n){return String(n).padStart(2,"0")}function draw(){sw.textContent=fmt(Math.floor(si/3600))+":"+fmt(Math.floor(si/60)%60)+":"+fmt(si%60)}function startSw(){clearInterval(st);st=setInterval(()=>{si++;draw()},1000)}function stopSw(){clearInterval(st)}function resetSw(){stopSw();si=0;draw()}function startTm(){clearInterval(tt);ti=Math.max(1,+min.value||1)*60;drawT();tt=setInterval(()=>{if(ti<=0){clearInterval(tt);alert("Timer finished");return}ti--;drawT()},1000)}function drawT(){tm.textContent=fmt(Math.floor(ti/60))+":"+fmt(ti%60)}function resetTm(){clearInterval(tt);ti=Math.max(1,+min.value||1)*60;drawT()}</script></body></html>
