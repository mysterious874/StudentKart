</script><header class="top"><button class="back" id="back" aria-label="Back"><i class="fas fa-arrow-left"></i></button><div class="brand"><img src="/icons/globedisc-icon-v2.svg"><div><strong>GlobeDisc</strong><small>Content Writer</small></div></div></header><main><section class="hero"><span style="font-size:12px;color:#0f8587;font-weight:700">AI TOOL</span><h1>Create better content</h1><p>Give GlobeDisc a topic and it will create useful, original content in your chosen style.</p></section><section class="panel"><div class="grid"><div class="field"><label>CONTENT TYPE</label><select class="select" id="type"><option>Article</option><option>Blog post</option><option>Social media post</option><option>Instagram caption</option><option>LinkedIn post</option><option>Product description</option><option>Essay</option><option>Story</option><option>Ad copy</option><option>Study notes</option><option>Video script</option></select></div><div class="field"><label>TONE</label><select class="select" id="tone"><option>Professional</option><option>Friendly</option><option>Simple</option><option>Formal</option><option>Persuasive</option><option>Creative</option><option>Academic</option><option>Casual</option></select></div><div class="field"><label>LENGTH</label><select class="select" id="length"><option>Short</option><option selected>Medium</option><option>Long</option></select></div><div class="field"><label>LANGUAGE</label><select class="select" id="lang"><option>English</option><option>Hindi</option><option>Marathi</option><option>Gujarati</option><option>Gor Boli / Lambadi</option></select></div></div><textarea class="text" id="topic" placeholder="What should I write about? Add your topic, audience, key points or instructions..."></textarea><div class="row"><button class="btn" id="generate">✍️ Generate</button><button class="btn secondary" id="clear">Clear</button></div><div class="status" id="status">Ready to write.</div></section><section class="panel hidden" id="resultPanel" style="margin-top:14px"><strong>Generated Content</strong><div class="result" id="result"></div><div class="row"><button class="btn secondary" id="copy">Copy Content</button></div></section></main><script>
const SUPABASE_URL="https://yymzfjfkmsrymqhpnfqz.supabase.co",SUPABASE_KEY="sb_publishable_tEePI-aSGDkt_2S6oiEfPw_Hy_mEXkw";const $=id=>document.getElementById(id);let output="";
$("back").onclick=()=>location.href="features.html";
$("generate").onclick=async()=>{const topic=$("topic").value.trim(),type=$("type").value,tone=$("tone").value,length=$("length").value,lang=$("lang").value;if(!topic)return $("status").textContent="Enter a topic or instructions first.";if(topic.length>10000)return $("status").textContent="Please keep the instructions under 10,000 characters.";$("generate").disabled=true;$("resultPanel").classList.remove("hidden");$("result").textContent="Writing…";$("status").textContent="GlobeDisc AI is creating your content…";try{const q=`Create a ${length.toLowerCase()} ${type} in ${lang}. Tone: ${tone}. Follow the user's topic/instructions below. Make it original, useful and well structured. Use headings or bullets when they improve readability. Do not mention that you are an AI. Do not invent specific facts when they are not provided; if factual accuracy depends on current information, state that it should be verified. User topic/instructions:\n\n${topic}`;const r=await fetch(SUPABASE_URL+"/functions/v1/ai-chat",{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({question:q,history:[],research:false})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.answer)throw new Error(d.error||"AI service unavailable");output=d.answer;$("result").textContent=output;$("status").textContent="Content generated."}catch(e){$("result").textContent="Could not generate content.";$("status").textContent=e.message||"AI service unavailable."}finally{$("generate").disabled=false}};
$("copy").onclick=async()=>{if(!output)return;try{await navigator.clipboard.writeText(output);$("copy").textContent="Copied ✓";$("status").textContent="Content copied.";setTimeout(()=>$("copy").textContent="Copy Content",1200)}catch(e){$("status").textContent="Copy failed. Select and copy manually."}};
$("clear").onclick=()=>{$("topic").value="";output="";$("resultPanel").classList.add("hidden");$("status").textContent="Ready to write."};
