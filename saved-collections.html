<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — Saved & Collections</title><link rel="icon" href="/icons/globedisc-icon-v2.svg"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5fbfc;color:#102a2c}.top{position:sticky;top:0;background:rgba(255,255,255,.94);border-bottom:1px solid #dceced;padding:12px 16px;display:flex;gap:12px;align-items:center}.back{border:0;background:#e8f6f7;border-radius:12px;width:42px;height:42px;color:#0f7779}.brand{display:flex;gap:9px;align-items:center}.brand img{width:36px}.brand small{display:block;color:#668184}main{max-width:850px;margin:auto;padding:20px 16px 60px}.hero,.card{background:#fff;border:1px solid #dcebec;border-radius:18px}.hero{padding:20px;background:linear-gradient(135deg,#e9fbfb,#fff)}h1{margin:5px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.input,select{width:100%;padding:12px;border:1px solid #cfe4e5;border-radius:12px;background:#fff}.btn{border:0;border-radius:12px;padding:12px 15px;background:#0f8b8d;color:#fff;font-weight:700}.items{display:grid;gap:10px;margin-top:14px}.item{padding:14px}.item strong{display:block}.item small{display:block;color:#6b7f81;margin-top:4px}.delete{margin-top:9px;border:1px solid #e2caca;background:#fff5f5;color:#a44;border-radius:9px;padding:7px 10px}.open{margin-top:9px;margin-right:6px;border:1px solid #cfe4e5;background:#e8f6f7;color:#0f7779;border-radius:9px;padding:7px 10px;font-weight:700}.muted{color:#6b7f81;font-size:13px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><header class="top"><button class="back" onclick="location.href='features.html'">←</button><div class="brand"><img src="/icons/globedisc-icon-v2.svg"><div><strong>GlobeDisc</strong><small>Saved & Collections</small></div></div></header><main><div class="hero"><span class="muted">SAVE WHAT MATTERS</span><h1>Saved & Collections</h1><p class="muted">Keep links, topics, notes and useful discoveries on this device.</p><div class="row"><input id="title" class="input" placeholder="Title"><input id="url" class="input" placeholder="Link or note"></div><button class="btn" style="margin-top:8px" onclick="save()">＋ Save item</button></div><div class="row"><input id="filter" class="input" placeholder="Search saved items…"><select id="collection" onchange="render()"><option value="">All collections</option><option>General</option><option>Study</option><option>Work</option><option>Travel</option><option>Tech</option></select></div><div class="items" id="items"></div></main><script>let data=[];try{data=JSON.parse(localStorage.getItem('globedisc_saved_items')||'[]')}catch{}function save(){const t=document.getElementById('title').value.trim(),u=document.getElementById('url').value.trim();if(!t&&!u)return;data.push({id:Date.now(),title:t||u,url:u,collection:document.getElementById('collection').value||'General'});persist();document.getElementById('title').value='';document.getElementById('url').value='';render()}function persist(){localStorage.setItem('globedisc_saved_items',JSON.stringify(data))}function openSaved(id){const x=data.find(v=>v.id===id);if(!x)return;try{const u=new URL(x.url);if(/^https?:$/.test(u.protocol))window.open(u.href,'_blank','noopener,noreferrer')}catch{}}function del(id){data=data.filter(x=>x.id!==id);persist();render()}function render(){const f=document.getElementById('filter').value.toLowerCase();const c=document.getElementById('collection').value;const a=data.filter(x=>(!f||(x.title+' '+x.url).toLowerCase().includes(f))&&(!c||x.collection===c));document.getElementById('items').innerHTML=a.length?a.slice().reverse().map(x=>'<div class="card item"><strong>'+esc(x.title)+'</strong><small>'+esc(x.url||'Saved item')+' · '+esc(x.collection)+'</small>'+(/^https?:\\/\\//i.test(String(x.url||''))?'<button class="open" onclick="openSaved('+x.id+')">Open</button>':'')+'<button class="delete" onclick="del('+x.id+')">Delete</button></div>').join(''):'<div class="card item muted">No saved items yet.</div>'}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}document.getElementById('filter').addEventListener('input',render);render();</script></body></html>
