t.dataset.mode});async function ask(){const q0=$("q").value.trim();if(!q0)return;$("ask").disabled=true;$("status").textContent="Finding the best answer…";$("result").style.display="none";const instruction=mode==="latest"?"Focus on what information should be verified as current and distinguish stable facts from changing facts.":mode==="learn"?"Teach the topic clearly with definitions, examples and a short learning path.":mode==="explain"?"Explain the answer simply and step by step.":"Answer directly, then add useful context.";const q=`You are GlobeDisc Answers. User question: ${q0}. Mode: ${mode}. ${instruction} Give an accurate, useful, structured answer. Do not invent current facts. If the question needs live web data, clearly say what should be checked live rather than pretending you searched. End with exactly 3 concise related questions the user could explore, each on a new line after "Related:".`;try{const r=await fetch(URL+"/functions/v1/ai-chat",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({question:q,history:[],research:mode==="latest"})});const x=await r.json();if(!r.ok)throw Error(x?.error||x?.message||"AI request failed");const text=x.answer||x.response||x.text||x.message||"No answer returned.";const parts=text.split(/\nRelated:\s*/i);$("answer").textContent=parts[0].trim();$("related").innerHTML=(parts[1]||"").split("\n").filter(Boolean).slice(0,3).map(v=>'<span>'+v.replace(/^[-•]\s*/,"")+'</span>').join("");$("result").style.display="block";$("status").textContent="Answer ready."}catch(e){$("status").textContent="Could not get an answer. "+e.message}finally{$("ask").disabled=false}}function quick(prefix){const v=$("q").value.trim();$("q").value=v?(prefix+": "+v):prefix;$("q").focus();ask()}$("q").addEventListener("input",()=>{$("quick").style.display=$("q").value.trim()?"flex":"none"});$("ask").onclick=ask;$("q").onkeydown=e=>{if(e.key==="Enter")ask()}</sc
