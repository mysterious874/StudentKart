<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — Translator</title><link rel="icon" type="image/svg+xml" href="/icons/globedisc-icon-v2.svg"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-bottom:1px solid #dceced;padding:12px 16px;display:flex;align-items:center;gap:12px}.back{border:0;background:#e8f6f7;border-radius:12px;width:42px;height:42px;color:#0f7779}.brand{display:flex;align-items:center;gap:9px}.brand img{width:36px;height:36px}.brand small{display:block;color:#668184}main{max-width:820px;margin:auto;padding:20px 14px 45px}.hero,.panel{background:#fff;border:1px solid #dcebec;border-radius:20px;padding:18px;box-shadow:0 8px 24px rgba(10,70,72,.06)}.hero{background:linear-gradient(135deg,#e9fbfb,#fff);margin-bottom:14px}.hero h1{margin:6px 0;font-size:28px}.hero p{margin:5px 0;color:#647679;font-size:14px}.langs{display:grid;grid-template-columns:1fr 48px 1fr;gap:8px;align-items:end}.field label{display:block;font-size:12px;font-weight:700;color:#587073;margin-bottom:6px}.select,.text{width:100%;border:1px solid #cfe4e5;border-radius:13px;background:#fff;color:#17383a;font:inherit}.select{padding:12px}.text{min-height:180px;padding:14px;resize:vertical;line-height:1.5;margin-top:12px}.swap{height:44px;border:0;border-radius:12px;background:#e8f6f7;color:#0f7779;font-size:16px;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:12px;padding:11px 15px;background:#0f8b8d;color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#e8f6f7;color:#0f7779}.btn:disabled{opacity:.55}.status{margin-top:12px;color:#647679;font-size:13px}.result{white-space:pre-wrap;line-height:1.55;font-size:15px;background:#f8fcfc;border:1px solid #e1eeee;border-radius:14px;padding:14px;min-height:120px}.hidden{display:none!important}@media(max-width:560px){.langs{grid-template-columns:1fr}.swap{width:100%}.text{min-height:150px}}
</style></head><body><header class="top"><button class="back" id="back" aria-label="Back"><i class="fas fa-arrow-left"></i></button><div class="brand"><img src="/icons/globedisc-icon-v2.svg"><div><strong>GlobeDisc</strong><small>Translator</small></div></div></header><main><section class="hero"><span style="font-size:12px;color:#0f8587;font-weight:700">AI TOOL</span><h1>Translate naturally</h1><p>Translate text between languages while keeping the meaning, tone and context.</p></section><section class="panel"><div class="langs"><div class="field"><label for="from">FROM</label><select class="select" id="from"><option value="Auto">Detect language</option><option>English</option><option>Hindi</option><option>Marathi</option><option>Gujarati</option><option>Punjabi</option><option>Bengali</option><option>Tamil</option><option>Telugu</option><option>Kannada</option><option>Malayalam</option><option>Urdu</option><option>Gor Boli / Lambadi</option><option>Spanish</option><option>French</option><option>German</option><option>Arabic</option><option>Chinese</option><option>Japanese</option><option>Korean</option><option>Russian</option></select></div><button class="swap" id="swap" title="Swap languages"><i class="fas fa-arrow-right-arrow-left"></i></button><div class="field"><label for="to">TO</label><select class="select" id="to"><option>English</option><option>Hindi</option><option>Marathi</option><option>Gujarati</option><option>Punjabi</option><option>Bengali</option><option>Tamil</option><option>Telugu</option><option>Kannada</option><option>Malayalam</option><option>Urdu</option><option>Gor Boli / Lambadi</option><option>Spanish</option><option>French</option><option>German</option><option>Arabic</option><option>Chinese</option><option>Japanese</option><option>Korean</option><option>Russian</option></select></div></div><textarea class="text" id="input" placeholder="Type or paste text here..."></textarea><div class="row"><button class="btn" id="translate">🌐 Translate</button><button class="btn secondary" id="clear">Clear</button></div><div class="status" id="status">Ready to translate.</div></section><section class="panel hidden" id="resultPanel" style="margin-top:14px"><strong>Translation</strong><div class="result" id="result"></div><div class="row"><button class="btn secondary" id="copy">Copy Translation</button></div></section></main><script>
function trackTool(name){try{const a=JSON.parse(localStorage.getItem("globedisc_recent_tools")||"[]");a.push({name,at:Date.now()});localStorage.setItem("globedisc_recent_tools",JSON.stringify(a.slice(-30)))}catch{}}trackTool("Translator");const SUPABASE_URL="https://yymzfjfkmsrymqhpnfqz.supabase.co",SUPABASE_KEY="sb_publishable_tEePI-aSGDkt_2S6oiEfPw_Hy_mEXkw";const $=id=>document.getElementById(id);let translated="";
$("back").onclick=()=>location.href="features.html";
$("swap").onclick=()=>{if($("from").value==="Auto")return;[$("from").value,$("to").value]=[$("to").value,$("from").value]};
$("translate").onclick=async()=>{const text=$("input").value.trim(),from=$("from").value,to=$("to").value;if(!text)return $("status").textContent="Enter some text first.";if(from===to)return $("status").textContent="Choose two different languages.";$("translate").disabled=true;$("resultPanel").classList.remove("hidden");$("result").textContent="Translating…";$("status").textContent="GlobeDisc AI is translating…";try{const q=`Translate the following text from ${from==="Auto"?"the detected source language":from} to ${to}. Preserve the meaning, context and tone. Return only the translated text, with no commentary. If the source uses Gor Boli / Lambadi, understand it as that language and translate accurately. Text:\n\n${text}`;const r=await fetch(SUPABASE_URL+"/functions/v1/ai-chat",{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({question:q,history:[],research:false})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.answer)throw new Error(d.error||"AI service unavailable");translated=d.answer;$("result").textContent=translated;$("status").textContent="Translation complete."}catch(e){$("result").textContent="Could not translate this text.";$("status").textContent=e.message||"AI service unavailable."}finally{$("translate").disabled=false}};
$("copy").onclick=async()=>{if(!translated)return;try{await navigator.clipboard.writeText(translated);$("copy").textContent="Copied ✓";$("status").textContent="Translation copied.";setTimeout(()=>$("copy").textContent="Copy Translation",1200)}catch(e){$("status").textContent="Copy failed. Select and copy manually."}};
$("clear").onclick=()=>{$("input").value="";translated="";$("resultPanel").classList.add("hidden");$("status").textContent="Ready to translate."};
function openFromQuery(){const p=new URLSearchParams(location.search);const q=p.get("text");if(q){$("input").value=q;$("status").textContent="Text loaded from GlobeDisc Voice Search."}}openFromQuery();
</script></body></html>
