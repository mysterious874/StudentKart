<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — Grammar Checker</title><link rel="icon" type="image/svg+xml" href="/icons/globedisc-icon-v2.svg"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-bottom:1px solid #dceced;padding:12px 16px;display:flex;align-items:center;gap:12px}.back{border:0;background:#e8f6f7;border-radius:12px;width:42px;height:42px;color:#0f7779}.brand{display:flex;align-items:center;gap:9px}.brand img{width:36px;height:36px}.brand small{display:block;color:#668184}main{max-width:820px;margin:auto;padding:20px 14px 45px}.hero,.panel{background:#fff;border:1px solid #dcebec;border-radius:20px;padding:18px;box-shadow:0 8px 24px rgba(10,70,72,.06)}.hero{background:linear-gradient(135deg,#e9fbfb,#fff);margin-bottom:14px}.hero h1{margin:6px 0;font-size:28px}.hero p{margin:5px 0;color:#647679;font-size:14px}.text{width:100%;min-height:220px;border:1px solid #cfe4e5;border-radius:14px;padding:14px;resize:vertical;font:inherit;line-height:1.55;color:#17383a;outline:none}.text:focus{border-color:#0f8b8d;box-shadow:0 0 0 3px rgba(15,139,141,.08)}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:12px;padding:11px 15px;background:#0f8b8d;color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#e8f6f7;color:#0f7779}.btn:disabled{opacity:.55}.status{margin-top:12px;color:#647679;font-size:13px}.result{white-space:pre-wrap;line-height:1.55;font-size:15px;background:#f8fcfc;border:1px solid #e1eeee;border-radius:14px;padding:14px;min-height:120px}.hidden{display:none!important}.meta{display:flex;justify-content:space-between;color:#718184;font-size:12px;margin-top:7px}
</style></head><body><header class="top"><button class="back" id="back" aria-label="Back"><i class="fas fa-arrow-left"></i></button><div class="brand"><img src="/icons/globedisc-icon-v2.svg"><div><strong>GlobeDisc</strong><small>Grammar Checker</small></div></div></header><main><section class="hero"><span style="font-size:12px;color:#0f8587;font-weight:700">AI TOOL</span><h1>Write better</h1><p>Fix grammar, spelling, punctuation and awkward wording while keeping your original meaning.</p></section><section class="panel"><textarea class="text" id="input" placeholder="Paste or type your text here..."></textarea><div class="meta"><span id="count">0 characters</span><span>Works with multiple languages</span></div><div class="row"><button class="btn" id="check">✓ Check & Fix</button><button class="btn secondary" id="clear">Clear</button></div><div class="status" id="status">Ready to check your text.</div></section><section class="panel hidden" id="resultPanel" style="margin-top:14px"><strong>Corrected Text</strong><div class="result" id="result"></div><div class="row"><button class="btn secondary" id="copy">Copy Corrected Text</button></div></section></main><script>
const SUPABASE_URL="https://yymzfjfkmsrymqhpnfqz.supabase.co",SUPABASE_KEY="sb_publishable_tEePI-aSGDkt_2S6oiEfPw_Hy_mEXkw";const $=id=>document.getElementById(id);let corrected="";
$("back").onclick=()=>location.href="features.html";
$("input").addEventListener("input",()=>{$("count").textContent=$("input").value.length.toLocaleString()+" characters"});
$("check").onclick=async()=>{const text=$("input").value.trim();if(!text)return $("status").textContent="Enter some text first.";if(text.length>50000)return $("status").textContent="Please keep the text under 50,000 characters.";$("check").disabled=true;$("resultPanel").classList.remove("hidden");$("result").textContent="Checking…";$("status").textContent="GlobeDisc AI is improving your text…";try{const q=`Correct the following text. Fix grammar, spelling, punctuation, sentence structure and obvious awkward wording. Preserve the original meaning, facts, tone and language. Do not add information. Return ONLY the corrected text, without explanations or quotation marks. If the text is already correct, return it unchanged.\n\n${text}`;const r=await fetch(SUPABASE_URL+"/functions/v1/ai-chat",{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({question:q,history:[],research:false})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.answer)throw new Error(d.error||"AI service unavailable");corrected=d.answer;$("result").textContent=corrected;$("status").textContent="Grammar check complete."}catch(e){$("result").textContent="Could not check the text.";$("status").textContent=e.message||"AI service unavailable."}finally{$("check").disabled=false}};
$("copy").onclick=async()=>{if(!corrected)return;try{await navigator.clipboard.writeText(corrected);$("copy").textContent="Copied ✓";$("status").textContent="Corrected text copied.";setTimeout(()=>$("copy").textContent="Copy Corrected Text",1200)}catch(e){$("status").textContent="Copy failed. Select and copy manually."}};
$("clear").onclick=()=>{$("input").value="";corrected="";$("count").textContent="0 characters";$("resultPanel").classList.add("hidden");$("status").textContent="Ready to check your text."};
</script></body></html>
