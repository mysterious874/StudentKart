<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — QR Toolkit</title><link rel="icon" href="/icons/globedisc-icon-v2.svg"><style>*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #dcebec;padding:12px 14px;display:flex;gap:10px;align-items:center}.top button,.btn{border:0;border-radius:12px;padding:10px 13px;background:#e8f6f7;color:#0f7779;font-weight:700}.page{max-width:760px;margin:auto;padding:18px 14px}.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:17px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#e9fbfb,#fff)}input{width:100%;padding:11px;border:1px solid #cfe4e5;border-radius:11px;font:inherit}.qrbox{text-align:center;margin-top:12px}.qrbox img{max-width:280px;width:100%;border-radius:12px;border:1px solid #dcebec}.out{white-space:pre-wrap;background:#f7fcfc;border:1px solid #dcebec;border-radius:11px;padding:11px;margin-top:9px}video{width:100%;max-height:360px;border-radius:14px;background:#102a2c}.hidden{display:none}</style></head><body><header class="top"><button onclick="location.href='features.html'">←</button><b>GlobeDisc · QR Toolkit</b></header><main class="page"><section class="panel hero"><h1>QR Generator & Scanner</h1><p>Create QR codes or scan with your device camera when supported.</p></section><section class="panel"><h2>Generate</h2><input id="text" placeholder="Text, URL, UPI link, contact…"><button class="btn" id="gen" style="margin-top:8px">Generate QR</button><div class="qrbox" id="qr"></div></section><section class="panel"><h2>Scan</h2><button class="btn" id="start">Start Camera Scan</button><button class="btn" id="stop" style="display:none">Stop</button><video id="video" class="hidden" playsinline></video><div class="out" id="scanOut">Camera scanning requires BarcodeDetector support.</div></section></main><script>const $=id=>document.getElementById(id);function make(){let t=$('text').value.trim();if(!t){$('qr').textContent='Enter text first.';return}$('qr').innerHTML='<img alt="Generated QR code" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(t)+'">'}$('gen').onclick=make;const p=new URLSearchParams(location.search).get('text');if(p){$('text').value=p;make()}let stream=null,loop=null;$('start').onclick=async()=>{if(!('BarcodeDetector'in window)){$('scanOut').textContent='BarcodeDetector is not supported in this browser.';return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});$('video').srcObject=stream;await $('video').play();$('video').classList.remove('hidden');$('start').style.display='none';$('stop').style.display='inline-block';const d=new BarcodeDetector({formats:['qr_code']});const scan=async()=>{try{const a=await d.detect($('video'));if(a.length)$('scanOut').textContent=a[0].rawValue}catch{}loop=requestAnimationFrame(scan)};scan()}catch{$('scanOut').textContent='Camera permission denied or unavailable.'}};$('stop').onclick=()=>{if(loop)cancelAnimationFrame(loop);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').classList.add('hidden');$('start').style.display='inline-block';$('stop').style.display='none'}</script></body></html>
