<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — QR Toolkit</title><link rel="icon" href="/icons/globedisc-icon-v2.svg"><style>*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.top{position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid #dcebec;padding:12px 14px;display:flex;align-items:center;gap:10px}.top button{border:0;border-radius:12px;padding:10px 13px;background:#e8f6f7;color:#0f7779}.brand img{width:32px;vertical-align:middle}.brand strong{margin-left:7px}.brand small{display:block;margin-left:39px;color:#668184}main{max-width:760px;margin:auto;padding:18px 14px 50px}.hero,.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:18px;margin-bottom:13px}.hero{background:linear-gradient(135deg,#e9fbfb,#fff)}.tabs{display:flex;gap:7px;margin-bottom:13px}.tab{flex:1;border:1px solid #cfe4e5;background:#fff;border-radius:11px;padding:10px;color:#456b6d}.tab.active{background:#0f8b8d;color:#fff}.input{width:100%;padding:13px;border:1px solid #cfe4e5;border-radius:12px;font:inherit}.btn{border:0;border-radius:12px;padding:11px 14px;background:#0f8b8d;color:#fff;font-weight:700;margin-top:9px}.result{margin-top:12px;padding:14px;background:#f5fbfc;border:1px solid #dcebec;border-radius:13px;overflow-wrap:anywhere}.qrbox{text-align:center}.qrbox img{max-width:240px;width:100%;border-radius:10px;margin-top:12px}.hidden{display:none}.muted{color:#667b7e;font-size:12px}.result a{color:#0f7779;font-weight:700}@media(max-width:480px){.tabs{gap:5px}.tab{font-size:13px;padding:9px 5px}}</style></head><body><header class="top"><button onclick="location.href='features.html'">←</button><div class="brand"><img src="/icons/globedisc-icon-v2.svg"><strong>GlobeDisc</strong><small>QR Toolkit</small></div></header><main><section class="hero"><b style="color:#0f8587">GLOBEDISC · QR</b><h1>Scan or create a QR code.</h1><p class="muted">Generate QR codes for text or links, or scan one using your camera/photo.</p></section><div class="tabs"><button class="tab active" id="genTab">Generate</button><button class="tab" id="scanTab">Scan</button></div><section class="panel" id="generator"><h3>Generate QR</h3><textarea class="input" id="text" rows="4" placeholder="Enter text, URL, UPI link, contact or anything…"></textarea><button class="btn" id="generate">Generate QR</button><div class="qrbox" id="qrout"></div></section><section class="panel hidden" id="scanner"><h3>Scan QR</h3><button class="btn" id="camera">Start camera</button><label class="btn" style="display:inline-block;cursor:pointer"><input id="file" type="file" accept="image/*" capture="environment" hidden>Scan image</label><video id="video" playsinline style="display:none;width:100%;margin-top:12px;border-radius:14px;background:#102a2c"></video><canvas id="canvas" hidden></canvas><div class="result" id="scanResult">Choose camera or an image containing a QR code.</div></section></main><script>const genTab=document.getElementById("genTab"),scanTab=document.getElementById("scanTab"),generator=document.getElementById("generator"),scanner=document.getElementById("scanner");function showScan(){genTab.classList.remove("active");scanTab.classList.add("active");generator.classList.add("hidden");scanner.classList.remove("hidden")}function showGen(){scanTab.classList.remove("active");genTab.classList.add("active");scanner.classList.add("hidden");generator.classList.remove("hidden")}genTab.onclick=showGen;scanTab.onclick=showScan;document.getElementById("generate").onclick=()=>{const v=document.getElementById("text").value.trim(),o=document.getElementById("qrout");if(!v){o.textContent="Enter something first.";return}o.innerHTML='<img alt="Generated QR code" src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data='+encodeURIComponent(v)+'"><br><button class="btn" onclick="window.open(document.querySelector(\'#qrout img\').src,\'_blank\',\'noopener\')">Open QR Image</button>'};let stream=null;async function scanBitmap(bitmap){const out=document.getElementById("scanResult");if(!("BarcodeDetector"in window)){out.textContent="QR scanning is not supported by this browser. Try Chrome on a supported device.";return}try{const d=new BarcodeDetector({formats:["qr_code"]}),a=await d.detect(bitmap),v=a[0]?.rawValue;if(!v){out.textContent="No QR code found.";return}if(/^https?:\\/\\//i.test(v)){const safe=document.createElement("a");safe.href=v;safe.target="_blank";safe.rel="noopener";safe.textContent=v;out.textContent="QR result: ";out.appendChild(safe)}else out.textContent="QR result: "+v}catch{out.textContent="Could not scan this image."}}document.getElementById("file").onchange=async e=>{const f=e.target.files?.[0];if(!f)return;showScan();document.getElementById("scanResult").textContent="Scanning…";try{await scanBitmap(await createImageBitmap(f))}catch{document.getElementById("scanResult").textContent="Could not read this image."}};document.getElementById("camera").onclick=async()=>{const v=document.getElementById("video"),out=document.getElementById("scanResult");if(!("BarcodeDetector"in window)){out.textContent="Camera QR scanning is not supported by this browser.";return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});v.srcObject=stream;v.style.display="block";await v.play();out.textContent="Point the camera at a QR code…";const d=new BarcodeDetector({formats:["qr_code"]});const loop=async()=>{if(!stream)return;try{const a=await d.detect(v);if(a[0]?.rawValue){out.textContent="QR result: "+a[0].rawValue;stream.getTracks().forEach(t=>t.stop());stream=null;return}}catch{}requestAnimationFrame(loop)};loop()}catch{out.textContent="Camera permission was not available. Use Scan image instead."}};try{const a=JSON.parse(localStorage.getItem("globedisc_recent_tools")||"[]");a.push({name:"QR Toolkit",at:Date.now()});localStorage.setItem("globedisc_recent_tools",JSON.stringify(a.slice(-30)))}catch{}</script></body></html>
