<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — Savings Goal</title><link rel="icon" href="/icons/globedisc-icon-v2.svg"><style>*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #dcebec;padding:12px 14px;display:flex;gap:10px}.btn{border:0;border-radius:11px;padding:10px 13px;background:#e8f6f7;color:#0f7779;font-weight:700}.page{max-width:700px;margin:auto;padding:18px 14px}.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:18px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#e9fbfb,#fff)}input{width:100%;padding:11px;border:1px solid #cfe4e5;border-radius:11px;margin:5px 0;font:inherit}.bar{height:14px;background:#edf5f5;border-radius:99px;overflow:hidden;margin:15px 0}.fill{height:100%;width:0;background:#0f8b8d}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f7fcfc;border:1px solid #dcebec;border-radius:13px;padding:12px;text-align:center}.stat b{display:block;font-size:18px}.muted{color:#637779}@media(max-width:520px){.stats{grid-template-columns:1fr}}</style></head><body><header class="top"><button class="btn" onclick="location.href='money-hub.html'">←</button><b>GlobeDisc · Savings Goal</b></header><main class=page><section class="panel hero"><h1>Savings Goal</h1><p class=muted>Set a target, track what you've saved and see your progress locally.</p></section><section class=panel><input id=name placeholder="Goal name (e.g. Laptop)"><input id=target type=number min=1 placeholder="Target amount (₹)"><input id=saved type=number min=0 placeholder="Already saved (₹)"><button class=btn onclick=save()>Save Goal</button></section><section class=panel id=view><p class=muted>No savings goal set.</p></section></main><script>const K="globedisc_savings_goal";function save(){let n=name.value.trim()||"Savings Goal",t=Number(target.value),s=Number(saved.value)||0;if(!t)return;localStorage.setItem(K,JSON.stringify({n,t,s:Math.min(s,t)}));render()}function render(){let x;try{x=JSON.parse(localStorage.getItem(K)||"null")}catch{}if(!x)return;name.value=x.n;target.value=x.t;saved.value=x.s;let p=Math.min(100,(x.s/x.t)*100),left=Math.max(0,x.t-x.s);view.innerHTML='<strong>'+esc(x.n)+'</strong><div class=bar><div class=fill style="width:'+p+'%"></div></div><div class=stats><div class=stat><b>₹'+x.s.toLocaleString("en-IN")+'</b><small>Saved</small></div><div class=stat><b>₹'+left.toLocaleString("en-IN")+'</b><small>Remaining</small></div><div class=stat><b>'+p.toFixed(0)+'%</b><small>Complete</small></div></div>'}function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}render()</script></body></html>
