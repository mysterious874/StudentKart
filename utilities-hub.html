<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — Utilities</title><link rel="icon" href="/icons/globedisc-icon-v2.svg"><style>body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui}.top,main{max-width:900px;margin:auto}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #dcebec;padding:12px}.top button,.btn{border:0;border-radius:12px;padding:10px 14px;background:#e8f6f7;color:#0f7779;font-weight:700}.top h2{display:inline;margin-left:10px}main{padding:18px 14px}.hero,.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:18px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#e9fbfb,#fff)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{border:1px solid #dcebec;border-radius:14px;padding:14px;background:#fbfefe}.card h3{margin:0 0 5px}.card p{font-size:12px;color:#637779}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cfe4e5;border-radius:12px;margin:7px 0}.out{white-space:pre-wrap;background:#f7fcfc;border:1px solid #dcebec;border-radius:12px;padding:12px;margin-top:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><button onclick="location.href='features.html'">←</button><h2>🧮 GlobeDisc Utilities</h2></header><main><section class="hero"><h1>Everyday utilities</h1><p>Fast calculators and handy browser tools.</p></section><section class="panel"><div class="grid" id="grid"></div></section></main><script>const list=["Calculator","Unit Converter","Currency Converter","Age Calculator","EMI Calculator","Percentage Calculator","GST Calculator","QR Generator","QR Scanner","Password Generator","Stopwatch / Timer","World Clock"];const g=document.getElementById("grid");g.innerHTML=list.map((n,i)=>`<div class="card"><h3>${n}</h3><p>${i===7?"Generate a QR code":i===8?"Scan using your camera":i===9?"Generate a strong random password":i===10?"Use your browser timer":i===11?"See world times": "Use the utility with a simple input."}</p><button class="btn" onclick="openTool(${i})">Open</button><div id="o${i}"></div></div>`).join("");function openTool(i){const o=document.getElementById("o"+i);if(i===9){const chars="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%";let s="";for(let j=0;j<16;j++)s+=chars[Math.floor(Math.random()*chars.length)];o.innerHTML=`<div class="out">${s}</div>`;return}if(i===10){o.innerHTML='<div class="out" id="timer">00:00</div><button class="btn" onclick="startTimer()">Start</button>';return}if(i===11){o.innerHTML='<div class="out">'+Intl.DateTimeFormat().resolvedOptions().timeZone+'<br>'+new Date().toLocaleString()+'</div>';return}if(i===7){o.innerHTML='<input id="qr" placeholder="Text or URL"><button class="btn" onclick="makeQR()">Generate</button><div id="qro"></div>';return}if(i===8){o.innerHTML='<button class="btn" onclick="location.href='https://www.google.com/search?q=QR+scanner'">Open scanner search</button>';return}o.innerHTML='<input id="u" placeholder="Enter values or question"><button class="btn" onclick="calc('+i+')">Calculate</button><div class="out" id="uo" style="display:none"></div>'}async function calc(i){const q=document.getElementById("u").value;if(!q)return;const o=document.getElementById("uo");o.style.display="block";o.textContent="Calculating…";try{const r=await fetch("https://yymzfjfkmsrymqhpnfqz.supabase.co/functions/v1/ai-chat",{method:"POST",headers:{apikey:"sb_publishable_tEePI-aSGDkt_2S6oiEfPw_Hy_mEXkw",Authorization:"Bearer sb_publishable_tEePI-aSGDkt_2S6oiEfPw_Hy_mEXkw","Content-Type":"application/json"},body:JSON.stringify({question:`Utility: ${list[i]}. Calculate this accurately: ${q}. Show concise working and final result.`,history:[],research:false})});const x=await r.json();o.textContent=x.answer||x.response||x.text||"No result."}catch(e){o.textContent="Could not calculate."}}function makeQR(){const v=document.getElementById("qr").value;if(v)document.getElementById("qro").innerHTML='<img style="max-width:180px;margin-top:10px" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(v)+'">'}function startTimer(){let s=60;const t=document.getElementById("timer");const id=setInterval(()=>{t.textContent="00:"+String(s).padStart(2,"0");if(--s<0)clearInterval(id)},1000)}</script></body></html>
