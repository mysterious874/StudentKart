<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="description" content="Banjara community connection app — chat, discover, connect, ask AI and stay connected.">
    <meta name="theme-color" content="#7b1e2b">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icons/banjara-connect-icon.svg">
    <link rel="apple-touch-icon" href="/icons/banjara-connect-icon.svg">
    <title>Banjara Connect — Community</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="/banjara-frontend-foundation.css?v=20261005-2">
    <link rel="stylesheet" href="/banjara-frontend-complete.css?v=20261005-3">
<link rel="stylesheet" href="/banjara-ai-theme.css?v=20261005-1">
</head>

<body class="banjara-splash-active">
    <div id="banjaraSplash" class="banjara-splash" aria-label="Banjara Connect loading" role="status" style="pointer-events:none!important;">
        <div class="banjara-splash-orbit banjara-orbit-one"></div><div class="banjara-splash-orbit banjara-orbit-two"></div>
        <div class="banjara-splash-logo" aria-hidden="true"><img src="/icons/banjara-connect-icon.svg" alt="" class="banjara-splash-icon"></div>
        <div class="banjara-splash-name"><span>Banjara</span><b>Connect</b></div>
        <div class="banjara-splash-tagline">Connected by community. Inspired by culture.</div>
        <div class="banjara-splash-progress"><span></span></div>
    </div>
    <script>
    (function () {
        try { if ("scrollRestoration" in history) history.scrollRestoration = "manual"; } catch (e) {}
        function resetAppScroll() { window.scrollTo(0, 0); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; }
        resetAppScroll();
        window.addEventListener("load", resetAppScroll, { once: true });
        window.addEventListener("pageshow", resetAppScroll);
    })();
    </script>
    <script>
    (function () {
        var splash = document.getElementById("banjaraSplash");
        if (!splash) return;
        window.setTimeout(function () {
            document.body.classList.remove("banjara-splash-active");
            splash.classList.add("is-hidden");
            splash.style.pointerEvents = "none";
            window.setTimeout(function () {
                if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
            }, 4250);
        }, 4000);
    })();
    </script>

        <section id="aiAssistantPage" class="ai-assistant-page hidden" aria-label="Ask with AI">
            <div class="ai-assistant-navbar">
                <div class="ai-assistant-navbar-inner">
                    <button type="button" id="aiAssistantBack" class="ai-assistant-back" aria-label="Back"><i class="fas fa-arrow-left"></i></button>
                    <div class="ai-assistant-brand"><span class="ai-assistant-brand-icon"><img src="/icons/banjara-connect-icon.svg" alt="Banjara Connect"></span><div><strong>Ask with AI</strong><small>Banjara Connect AI</small></div></div>
                    <button type="button" id="aiAssistantNewChat" class="ai-assistant-new-chat" aria-label="New chat"><i class="fas fa-pen-to-square"></i></button>
                </div>
            </div>
            <div class="ai-assistant-shell">
                <div id="aiAssistantMessages" class="ai-assistant-messages">
                    <div id="aiAssistantWelcome" class="ai-assistant-welcome">
                        <div class="ai-assistant-welcome-icon"><img src="/icons/banjara-connect-icon.svg" alt="Banjara Connect"></div>
                        <h1>What can I help you with?</h1>
                        <p>Ask anything. Banjara Connect AI will bring together answers and useful sources.</p>
                    </div>
                </div>
                <form id="aiAssistantForm" class="ai-assistant-composer">
                    <textarea id="aiAssistantInput" rows="1" placeholder="Ask anything..." autocomplete="off" aria-label="Ask anything"></textarea>
                    <button type="submit" id="aiAssistantSend" aria-label="Send"><i class="fas fa-arrow-up"></i></button>
                </form>
            </div>
        </section>

<script src="/banjara-frontend-complete.js?v=20261005-stable" defer></script>
