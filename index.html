<style id="studentkart-hero-search-final-fix">
/* Hero -> sticky search: it starts in normal page flow, then docks directly below navbar. */
#heroSearchStrip {
    position: sticky !important;
    /* Keep a small visual gap below the main navbar while scrolling. */
    top: calc(var(--studentkart-navbar-height, 76px) + 12px) !important;
    z-index: 900 !important;
    width: 100% !important;
    margin: 0 auto !important;
}
#heroSearchStrip .hero-search-inner {
    width: min(1180px, calc(100% - 32px)) !important;
    margin: 0 auto !important;
}

/* Give the listings area a little more breathing room below the search strip. */
#heroSearchStrip + .section-heading,
#heroSearchStrip ~ .section-heading {
    margin-top: 22px !important;
}

/* Keep the "Showing latest listings" row clearly separated from the sticky search. */
#marketplace #filterStatus {
    margin-top: 30px !important;
}
@media (max-width: 768px) {
    #marketplace #filterStatus {
        margin-top: 26px !important;
    }
}
#heroSearchStrip .hero-search-suggestions {
    z-index: 950 !important;
}
/* Never let the home search strip sit above another full-page view. */
body.studentkart-modal-navigation-hidden #heroSearchStrip,
body.search-results-mobile-view #heroSearchStrip,
body.studentkart-search-results-open #heroSearchStrip,
body.studentkart-category-page-open #heroSearchStrip,
body.studentkart-product-page-open #heroSearchStrip {
    display: none !important;
}
/* This old rule was making the search strip sit above everything. */
.hero-search-strip,
.navbar-search-panel { z-index: auto !important; }
.navbar-search-panel { z-index: 9999 !important; }
@media (max-width: 768px) {
    #heroSearchStrip {
        /* Keep the search bar slightly separated from the navbar on mobile too. */
        top: calc(var(--studentkart-navbar-height, 68px) + 8px) !important;
    }
    #heroSearchStrip .hero-search-inner {
        width: calc(100% - 24px) !important;
    }
}
</style>
