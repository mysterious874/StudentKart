<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — Notes</title><link rel="icon" href="/icons/globedisc-icon-v2.svg"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5fbfc;color:#102a2c}.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid #dceced;padding:12px 16px;display:flex;align-items:center;gap:12px}.back{border:0;background:#e8f6f7;border-radius:12px;width:42px;height:42px;color:#0f7779;font-size:16px}.brand{display:flex;gap:9px;align-items:center}.brand img{width:36px;height:36px}.brand strong{display:block}.brand small{color:#668184}main{max-width:900px;margin:auto;padding:20px 14px 50px}.hero,.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:18px;margin-bottom:14px}.hero{background:linear-gradient(135deg,#e9fbfb,#fff);border-color:#d7eeee}.ey{font-size:12px;color:#0f8587;font-weight:700}.hero h1{margin:5px 0;font-size:28px}.hero p{margin:7px 0;color:#607477;font-size:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}input,textarea{width:100%;border:1px solid #cfe4e5;border-radius:12px;background:#fbfefe;color:#17383b;padding:11px 12px;font:inherit}textarea{min-height:180px;resize:vertical}.toolbar input{flex:1;min-width:180px}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#0f8b8d;color:#fff}.secondary{background:#e8f6f7;color:#0f7779}.notes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.note{border:1px solid #dcebec;border-radius:14px;padding:13px;background:#fbfefe;cursor:pointer}.note h3{margin:0 0 5px;font-size:15px}.note p{margin:0;color:#637779;font-size:12px;line-height:1.45;white-space:pre-wrap;max-height:65px;overflow:hidden}.meta{margin-top:9px;font-size:10px;color:#8a9b9d}.empty{text-align:center;color:#738587;padding:25px}.actions{display:flex;gap:8px;margin-top:10px}@media(max-width:650px){.notes{grid-template-columns:1fr}.hero h1{font-size:25px}}</style></head><body><header class="top"><button class="back" onclick="location.href='features.html'">←</button><div class="brand"><img src="/icons/globedisc-icon-v2.svg"><div><strong>GlobeDisc</strong><small>Notes</small></div></div></header><main><section class="hero"><div class="ey">STUDY · NOTES</div><h1>Keep your notes handy</h1><p>Create, search, edit and delete notes. Notes are saved locally in this browser.</p></section><section class="panel"><div class="toolbar"><input id="search" placeholder="Search notes…"><button class="btn primary" id="new">+ New Note</button></div><div id="editor" style="display:none"><input id="title" placeholder="Note title"><textarea id="body" placeholder="Write your note…"></textarea><div class="actions"><button class="btn primary" id="save">Save Note</button><button class="btn secondary" id="cancel">Cancel</button></div></div></section><section class="panel"><div id="notes" class="notes"></div></section></main><script>const $=id=>document.getElementById(id);let notes=JSON.parse(localStorage.getItem("globedisc_notes")||"[]"),editing=null;function persist(){localStorage.setItem("globedisc_notes",JSON.stringify(notes))}function render(){const q=$("search").value.trim().toLowerCase(),list=notes.filter(n=>(n.title+" "+n.body).toLowerCase().includes(q));$("notes").innerHTML=list.length?list.map(n=>`<article class="note" data-id="${n.id}"><h3>${escapeHtml(n.title||"Untitled")}</h3><p>${escapeHtml(n.body)}</p><div class="meta">${new Date(n.updated).toLocaleString()}</div></article>`).join(""):'<div class="empty">No notes found. Create your first note.</div>';document.querySelectorAll(".note").forEach(x=>x.onclick=()=>edit(+x.dataset.id))}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function openNew(){$("editor").style.display="block";$("title").value="";$("body").value="";editing=null;$("title").focus()}function edit(id){const n=notes.find(x=>x.id===id);if(!n)return;editing=id;$("editor").style.display="block";$("title").value=n.title;$("body").value=n.body;$("title").focus()}$("new").onclick=openNew;$("cancel").onclick=()=>{$("editor").style.display="none";editing=null};$("save").onclick=()=>{const title=$("title").value.trim()||"Untitled",body=$("body").value.trim();if(!body){$("body").focus();return}if(editing){const n=notes.find(x=>x.id===editing);n.title=title;n.body=body;n.updated=Date.now()}else notes.unshift({id:Date.now(),title,body,updated:Date.now()});persist();$("editor").style.display="none";editing=null;render()};$("search").oninput=render;render()</script></body></html>
