<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — Creator Tools</title><style>*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #dcebec;padding:11px 14px;display:flex;gap:10px}.top button,.btn{border:0;border-radius:12px;padding:10px 13px;background:#e8f6f7;color:#0f7779;font-weight:700}.page{max-width:980px;margin:auto;padding:16px 14px 60px}.hero,.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:18px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#e9fbfb,#fff)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{border:1px solid #dcebec;border-radius:14px;padding:14px;background:#fbfefe;text-align:left}.icon{width:38px;height:38px;border-radius:11px;background:#e8f7f7;color:#0f8587;display:grid;place-items:center;margin-bottom:9px}input,textarea,select{width:100%;padding:10px;border:1px solid #cfe4e5;border-radius:11px;margin:5px 0;font:inherit}textarea{min-height:130px}.row{display:flex;gap:7px;flex-wrap:wrap}.out{white-space:pre-wrap;word-break:break-word;background:#f7fcfc;border:1px solid #dcebec;border-radius:11px;padding:11px;margin-top:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><button class="btn" onclick="location.href='features.html'">←</button><b style="padding-top:9px">GlobeDisc · Creator Tools</b></header><main class="page"><section class="hero"><small style="color:#0f8587;font-weight:800">CREATE FASTER</small><h1>Write, clean and transform text.</h1><p>Useful creator utilities that run directly in your browser.</p></section><section class="panel"><div class="grid"><button class="card" onclick="openT('case')"><div class="icon">Aa</div><b>Case Converter</b><small>UPPER, lower, Title and sentence case</small></button><button class="card" onclick="openT('slug')"><div class="icon">🔗</div><b>Slug Generator</b><small>Create clean URL slugs</small></button><button class="card" onclick="openT('escape')"><div class="icon">&lt;&gt;</div><b>HTML Escape</b><small>Escape and unescape HTML text</small></button><button class="card" onclick="openT('freq')"><div class="icon">123</div><b>Word Frequency</b><small>Find repeated words</small></button><button class="card" onclick="openT('tts')"><div class="icon">🔊</div><b>Text to Speech</b><small>Read text aloud with your device</small></button><button class="card" onclick="openT('markdown')"><div class="icon">M↓</div><b>Markdown Preview</b><small>Preview basic Markdown instantly</small></button></div></section><section class="panel"><div id="tool"><p>Choose a tool.</p></div></section></main><script>const box=document.getElementById("tool");function openT(n){const m={case:`<h3>Case Converter</h3><textarea id="tx"></textarea><div class="row"><button class="btn" onclick="cv('upper')">UPPER</button><button class="btn" onclick="cv('lower')">lower</button><button class="btn" onclick="cv('title')">Title</button><button class="btn" onclick="cv('sentence')">Sentence</button></div>`,slug:`<h3>Slug Generator</h3><textarea id="sg" placeholder="Your article or page title"></textarea><button class="btn" onclick="slug()">Generate</button><div id="so" class="out"></div>`,escape:`<h3>HTML Escape</h3><textarea id="ht"></textarea><div class="row"><button class="btn" onclick="esc(1)">Escape</button><button class="btn" onclick="esc(0)">Unescape</button></div><div id="ho" class="out"></div>`,freq:`<h3>Word Frequency</h3><textarea id="fw"></textarea><button class="btn" onclick="freq()">Analyze</button><div id="fo" class="out"></div>`,tts:`<h3>Text to Speech</h3><textarea id="sp" placeholder="Type something to hear it aloud"></textarea><select id="voice"></select><div class="row"><button class="btn" onclick="speak()">Speak</button><button class="btn" onclick="speechSynthesis.cancel()">Stop</button></div>`,markdown:`<h3>Markdown Preview</h3><textarea id="md" placeholder="# Heading\n\n**bold** and *italic*"></textarea><div id="mdo" class="out"></div>`};box.innerHTML=m[n];if(n==="tts")loadVoices();if(n==="markdown")md.oninput=preview}function cv(m){let s=tx.value;if(m==="upper")tx.value=s.toUpperCase();else if(m==="lower")tx.value=s.toLowerCase();else if(m==="title")tx.value=s.toLowerCase().replace(/\b\w/g,x=>x.toUpperCase());else tx.value=s.toLowerCase().replace(/(^|[.!?]\s+)(\w)/g,(a,b,c)=>b+c.toUpperCase())}function slug(){so.textContent=sg.value.toLowerCase().trim().replace(/[^\w\s-]/g,"").replace(/[\s_-]+/g,"-").replace(/^-+|-+$/g,"")}function esc(e){let s=ht.value;if(e)ho.textContent=s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");else{const d=document.createElement("textarea");d.innerHTML=s;ho.textContent=d.value}}function freq(){const a=(fw.value.toLowerCase().match(/[\p{L}\p{N}']+/gu)||[]),m={};a.forEach(x=>m[x]=(m[x]||0)+1);fo.textContent=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,30).map(x=>x[0]+" — "+x[1]).join("\n")||"No words."}function loadVoices(){voice.innerHTML=speechSynthesis.getVoices().map((v,i)=>'<option value="'+i+'">'+v.name+' · '+v.lang+'</option>').join("");speechSynthesis.onvoiceschanged=()=>loadVoices()}function speak(){const u=new SpeechSynthesisUtterance(sp.value);const v=speechSynthesis.getVoices()[Number(voice.value)];if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}function preview(){let s=md.value.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>").replace(/\*\*(.*?)\*\*/g,"<b>$1</b>").replace(/\*(.*?)\*/g,"<i>$1</i>").replace(/\n/g,"<br>");mdo.innerHTML=s}</script></body></html>
