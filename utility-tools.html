<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=theme-color content=#0f8b8d><title>GlobeDisc — Utility Tools</title><style>*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui}.top{background:#fff;border-bottom:1px solid #dcebec;padding:12px}.btn{border:0;border-radius:12px;padding:10px 14px;background:#e8f6f7;color:#0f7779;font-weight:700}.wrap{max-width:760px;margin:auto;padding:18px 14px}.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}}input{width:100%;padding:11px;border:1px solid #cfe4e5;border-radius:11px;margin:5px 0}.out{font-size:18px;font-weight:800;color:#0f8587;margin-top:10px}.tab{margin:3px}@media(max-width:600px){.tab{width:100%}}</style></head><body><header class=top><button class=btn onclick=history.back()>←</button> <b>GlobeDisc · Utility Tools</b></header><main class=wrap><div class=panel><h2>Quick Utilities</h2><button class="btn tab" onclick=show('timer')>Stopwatch / Timer</button><button class="btn tab" onclick=show('age')>Age</button><button class="btn tab" onclick=show('percent')>Percentage</button><button class="btn tab" onclick=show('gst')>GST</button></div><section id=app class=panel></section></main><script>let timer=null,sec=0;function show(t){if(t==='timer')app.innerHTML='<h3>Stopwatch</h3><div class=out id=clock>00:00:00</div><button class=btn onclick=start()>Start</button> <button class=btn onclick=stop()>Stop</button> <button class=btn onclick=reset()>Reset</button>';if(t==='age')app.innerHTML='<h3>Age Calculator</h3><input id=d type=date><button class=btn onclick=age()>Calculate</button><div class=out id=o></div>';if(t==='percent')app.innerHTML='<h3>Percentage</h3><input id=a type=number placeholder="Value"><input id=b type=number placeholder="Total"><button class=btn onclick=pct()>Calculate</button><div class=out id=o></div>';if(t==='gst')app.innerHTML='<h3>GST Calculator</h3><input id=a type=number placeholder="Amount"><input id=b type=number placeholder="GST %"><button class=btn onclick=gst()>Calculate</button><div class=out id=o></div>'}function draw(){clock.textContent=new Date(sec*1000).toISOString().slice(11,19)}function start(){if(timer)return;timer=setInterval(()=>{sec++;draw()},1000)}function stop(){clearInterval(timer);timer=null}function reset(){stop();sec=0;draw()}function age(){let x=new Date(d.value),n=new Date;if(!d.value)return;o.textContent=Math.max(0,n.getFullYear()-x.getFullYear()-((n.getMonth()<x.getMonth()||n.getMonth()==x.getMonth()&&n.getDate()<x.getDate())?1:0))+' years'}function pct(){o.textContent=b.value?(a.value/b.value*100).toFixed(2)+'%':'Enter values'}function gst(){let x=+a.value||0,r=+b.value||0,g=x*r/100;o.textContent='GST: ₹'+g.toFixed(2)+' · Total: ₹'+(x+g).toFixed(2)}show('timer')</script></body></html>
