<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=theme-color content=#0f8b8d><title>GlobeDisc — Flashcards</title><style>*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui}.top{background:#fff;border-bottom:1px solid #dcebec;padding:12px}.btn{border:0;border-radius:12px;padding:10px 14px;background:#e8f6f7;color:#0f7779;font-weight:700}.wrap{max-width:700px;margin:auto;padding:18px 14px}.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:18px;margin-bottom:12px}.card{min-height:190px;display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,#e9fbfb,#fff);border:1px solid #cfe4e5;border-radius:18px;padding:25px;font-size:22px;font-weight:800}.muted{color:#637779}</style></head><body><header class=top><button class=btn onclick=history.back()>←</button> <b>GlobeDisc · Flashcards</b></header><main class=wrap><section class=panel><input id=topic placeholder="Topic e.g. OSI Model" style="width:100%;padding:11px;border:1px solid #cfe4e5;border-radius:11px"><button class=btn onclick=start()>Create Cards</button></section><section class=panel id=area></section></main><script>let cards=[],i=0,back=false;function start(){let t=topic.value.trim()||"Computer Science";cards=["What is "+t+"?","Why is "+t+" important?","Name one core concept of "+t+".","Give one real-world example of "+t+".","What should a beginner practice in "+t+"?"].map((q,n)=>({q,a:["Understand the definition and core idea.","It helps build reliable technical understanding.","Learn its key concepts and terminology.","Connect the concept to a practical use case.","Practice small examples and review mistakes."][n]}));i=0;back=false;show()}function show(){let x=cards[i];area.innerHTML='<div class=card onclick="back=!back;show()">'+(back?x.a:x.q)+'</div><p class=muted>Card '+(i+1)+' / '+cards.length+' · Tap card to flip</p><button class=btn onclick="i=(i+cards.length-1)%cards.length;back=false;show()">← Previous</button> <button class=btn onclick="i=(i+1)%cards.length;back=false;show()">Next →</button>'}</script></body></html>
