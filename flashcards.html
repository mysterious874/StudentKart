<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=theme-color content=#0f8b8d><title>GlobeDisc — Flashcards</title><style>*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui}.top{background:#fff;border-bottom:1px solid #dcebec;padding:12px}.btn{border:0;border-radius:12px;padding:10px 14px;background:#e8f6f7;color:#0f7779;font-weight:700}.wrap{max-width:700px;margin:auto;padding:18px 14px}.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:18px;margin-bottom:12px}.card{min-height:190px;display:grid;place-items:center;text-align:center;background:linear-gradient(135deg,#e9fbfb,#fff);border:1px solid #cfe4e5;border-radius:18px;padding:25px;font-size:22px;font-weight:800}.muted{color:#637779}</style></head><body><header class=top><button class=btn onclick="GlobeDiscBack();return false">←</button> <b>GlobeDisc · Flashcards</b></header><main class=wrap><section class=panel><input id=topic placeholder="Topic e.g. OSI Model" style="width:100%;padding:11px;border:1px solid #cfe4e5;border-radius:11px"><button class=btn onclick=start()>Create Cards</button></section><section class=panel id=area></section></main><script>let cards=[],i=0,back=false;const bank={python:[["What is Python?","A high-level programming language."],["What is a list?","An ordered mutable collection."],["What is a dictionary?","A key-value data structure."]],networking:[["What is DNS?","A system that maps domain names to IP addresses."],["What is HTTP?","A protocol used for web communication."],["What is a router?","A device that forwards packets between networks."]],javascript:[["What is JavaScript?","A programming language widely used for web interactivity."],["What is const?","A declaration for a binding that cannot be reassigned."],["What is JSON?","A lightweight data-interchange format."]]};function start(){let t=topic.value.trim()||"Computer Science",k=t.toLowerCase(),base=bank[k]||bank[k.includes("network")?"networking":k.includes("python")?"python":k.includes("javascript")||k.includes("js")?"javascript":"python"];cards=[...base,...base].slice(0,5).map(x=>({q:x[0],a:x[1]}));i=0;back=false;show()}function show(){let x=cards[i];area.innerHTML='<div class=card onclick="back=!back;show()">'+(back?x.a:x.q)+'</div><p class=muted>Card '+(i+1)+' / '+cards.length+' · Tap card to flip</p><button class=btn onclick="i=(i+cards.length-1)%cards.length;back=false;show()">← Previous</button> <button class=btn onclick="i=(i+1)%cards.length;back=false;show()">Next →</button>'}</script><script src="/globedisc-mobile-navigation.js?v=20261004-nav-1" defer></script>\n</body></html>
