<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — Email Generator</title><link rel="icon" href="/icons/globedisc-icon-v2.svg"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5fbfc;color:#102a2c}.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid #dceced;padding:12px 16px;display:flex;align-items:center;gap:12px}.back{border:0;background:#e8f6f7;border-radius:12px;width:42px;height:42px;color:#0f7779;font-size:16px}.brand{display:flex;gap:9px;align-items:center}.brand img{width:36px;height:36px}.brand strong{display:block}.brand small{color:#668184}main{max-width:850px;margin:auto;padding:20px 14px 50px}.hero,.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:18px;margin-bottom:14px}.hero{background:linear-gradient(135deg,#e9fbfb,#fff);border-color:#d7eeee}.ey{font-size:12px;color:#0f8587;font-weight:700}.hero h1{margin:5px 0;font-size:28px}.hero p{margin:7px 0;color:#607477;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:12px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:700;color:#557174;margin-bottom:7px}input,textarea,select{width:100%;border:1px solid #cfe4e5;border-radius:12px;background:#fbfefe;color:#17383b;padding:11px 12px;font:inherit}textarea{min-height:145px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#0f8b8d;color:#fff}.secondary{background:#e8f6f7;color:#0f7779}.status{font-size:12px;color:#718486;margin-top:9px;min-height:17px}.result{display:none;margin-top:14px;border:1px solid #dcebec;border-radius:14px;overflow:hidden}.rhead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#eef9f9;border-bottom:1px solid #dcebec;font-size:13px;font-weight:700}.result pre{margin:0;padding:16px;white-space:pre-wrap;word-break:break-word;font:13px/1.55 system-ui;color:#183b3e;background:#fbfefe}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.hero h1{font-size:25px}}</style></head><body><header class="top"><button class="back" onclick="location.href='features.html'">←</button><div class="brand"><img src="/icons/globedisc-icon-v2.svg"><div><strong>GlobeDisc</strong><small>Email Generator</small></div></div></header><main><section class="hero"><div class="ey">AI TOOLS · EMAIL GENERATOR</div><h1>Write the right email</h1><p>Describe what you need to say and GlobeDisc AI will create a clear, polished email.</p></section><section class="panel"><div class="grid"><div class="field"><label>Purpose</label><select id="purpose"><option>General email</option><option>Job application</option><option>Internship request</option><option>College / professor</option><option>Leave request</option><option>Complaint</option><option>Follow-up</option><option>Meeting request</option><option>Thank you</option><option>Apology</option><option>Business inquiry</option><option>Other</option></select></div><div class="field"><label>Tone</label><select id="tone"><option>Professional</option><option>Friendly</option><option>Formal</option><option>Casual</option><option>Persuasive</option><option>Polite and concise</option></select></div><div class="field"><label>Language</label><select id="language"><option>English</option><option>Hindi</option><option>Marathi</option><option>Gujarati</option><option>Gor Boli / Lambadi</option><option>Spanish</option><option>French</option><option>German</option></select></div><div class="field"><label>Recipient</label><input id="recipient" placeholder="e.g. Professor, HR Manager"></div><div class="field full"><label>What should the email say?</label><textarea id="details" placeholder="Tell me the situation, important details, dates, names, request, or anything you want included..."></textarea></div></div><div class="actions"><button class="btn primary" id="generate">Generate Email</button><button class="btn secondary" id="clear">Clear</button></div><div class="status" id="status"></div><div class="result" id="result"><div class="rhead"><span>Generated Email</span><button class="btn secondary" id="copy" style="padding:7px 10px;font-size:12px">Copy</button></div><pre id="answer"></pre></div></section></main><script>const URL="https://yymzfjfkmsrymqhpnfqz.supabase.co",KEY="sb_publishable_tEePI-aSGDkt_2S6oiEfPw_Hy_mEXkw",$=id=>document.getElementById(id);async function generate(){const d=$("details").value.trim();if(!d){$("status").textContent="Describe what you want to say first.";return}const q=`Write a complete email. Purpose: ${$("purpose").value}. Tone: ${$("tone").value}. Language: ${$("language").value}. Recipient role: ${$("recipient").value||"not specified"}. User's details: ${d}. Return a useful subject line followed by the email body. Preserve every important fact supplied by the user. Do not invent names, dates, claims, attachments or contact details. Keep it natural, clear and ready to send.`;$("generate").disabled=true;$("status").textContent="Writing email…";$("result").style.display="none";try{const r=await fetch(URL+"/functions/v1/ai-chat",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({question:q,history:[],research:false})});const x=await r.json();if(!r.ok)throw Error(x?.error||x?.message||"AI request failed");$("answer").textContent=x.answer||x.response||x.text||x.message||"No email returned.";$("result").style.display="block";$("status").textContent="Email ready."}catch(e){$("status").textContent="Could not generate email. "+e.message}finally{$("generate").disabled=false}}$("generate").onclick=generate;$("clear").onclick=()=>{document.querySelectorAll("input,textarea").forEach(x=>x.value="");$("result").style.display="none";$("answer").textContent="";$("status").textContent=""};$("copy").onclick=async()=>{await navigator.clipboard.writeText($("answer").textContent);$("status").textContent="Email copied."}</script></body></html>
