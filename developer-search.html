<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=theme-color content=#0f8b8d><title>GlobeDisc — Developer Search</title><style>*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui}.top{background:#fff;border-bottom:1px solid #dcebec;padding:12px}.btn{border:0;border-radius:12px;padding:10px 14px;background:#e8f6f7;color:#0f7779;font-weight:700}.wrap{max-width:780px;margin:auto;padding:18px 14px}.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:16px;margin-bottom:12px}.tabs{display:flex;gap:7px;flex-wrap:wrap}input{width:100%;padding:12px;border:1px solid #cfe4e5;border-radius:11px;margin:8px 0}.result{padding:12px;border:1px solid #dcebec;border-radius:12px;margin:8px 0}.result a{color:#0f7779;font-weight:700;text-decoration:none}</style></head><body><header class=top><button class=btn onclick="GlobeDiscBack();return false">←</button> <b>GlobeDisc · Developer Search</b></header><main class=wrap><section class=panel><h2>Developer Search</h2><div class=tabs><button class=btn onclick=mode='github'>GitHub</button><button class=btn onclick=mode='docs'>Docs</button><button class=btn onclick=mode='api'>API Helper</button></div><input id=q placeholder="Search repositories, documentation or APIs"><button class=btn onclick=go()>Search</button></section><section class=panel id=out></section></main><script>let mode='github';function go(){let x=q.value.trim();if(!x)return;if(mode==='github')out.innerHTML='<div class=result>Searching GitHub for <b>'+x.replace(/[<>&]/g,'')+'</b>…</div><div class=result><a target=_blank href="https://github.com/search?q='+encodeURIComponent(x)+'&type=repositories">Open GitHub repository search →</a></div>';else if(mode==='docs')out.innerHTML='<div class=result><b>Documentation search</b></div><div class=result><a target=_blank href="https://www.google.com/search?q='+encodeURIComponent(x+' official documentation')+'">Search official documentation →</a></div>';else out.innerHTML='<div class=result><b>API Helper</b><p>Search for an API, then open its official documentation before using credentials or endpoints.</p><a target=_blank href="https://www.google.com/search?q='+encodeURIComponent(x+' API official documentation')+'">Find official API docs →</a></div>'}</script><script src="/globedisc-mobile-navigation.js?v=20261004-nav-1" defer></script>\n</body></html>
