<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — Image to Text</title>
<link rel="icon" type="image/svg+xml" href="/icons/globedisc-icon-v2.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-bottom:1px solid #dceced;padding:12px 16px;display:flex;align-items:center;gap:12px}.back{border:0;background:#e8f6f7;border-radius:12px;width:42px;height:42px;color:#0f7779}.brand{display:flex;align-items:center;gap:9px}.brand img{width:36px;height:36px}.brand small{display:block;color:#668184}
main{max-width:760px;margin:auto;padding:20px 14px 45px}.hero,.panel{background:#fff;border:1px solid #dcebec;border-radius:20px;padding:18px;box-shadow:0 8px 24px rgba(10,70,72,.06)}.hero{background:linear-gradient(135deg,#e9fbfb,#fff);margin-bottom:14px}.hero h1{margin:6px 0;font-size:28px}.hero p{margin:5px 0;color:#647679;font-size:14px}.drop{display:block;border:2px dashed #b9d9da;border-radius:17px;padding:24px 15px;text-align:center;cursor:pointer;background:#fbfefe}.drop.drag{border-color:#0f8b8d;background:#effafa}.drop i{font-size:32px;color:#0f8b8d}.drop strong{display:block;margin-top:9px}.drop small{color:#718184}.preview{display:none;width:100%;max-height:300px;object-fit:contain;border-radius:14px;margin-top:12px;border:1px solid #dcebec;background:#f8fcfc}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:12px;padding:11px 15px;background:#0f8b8d;color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#e8f6f7;color:#0f7779}.btn:disabled{opacity:.55}.status{margin-top:12px;color:#647679;font-size:13px}.result{white-space:pre-wrap;line-height:1.55;font-size:14px;background:#f8fcfc;border:1px solid #e1eeee;border-radius:14px;padding:14px;min-height:80px}.hidden{display:none!important}.meta{font-size:12px;color:#718184;margin-top:7px}
</style></head>
<body>
<header class="top"><button class="back" id="back" aria-label="Back"><i class="fas fa-arrow-left"></i></button><div class="brand"><img src="/icons/globedisc-icon-v2.svg"><div><strong>GlobeDisc</strong><small>Image → Text</small></div></div></header>
<main>
<section class="hero"><span style="font-size:12px;color:#0f8587;font-weight:700">AI TOOL</span><h1>Turn images into text</h1><p>Upload a photo, screenshot or document image and extract readable text instantly.</p></section>
<section class="panel">
<label class="drop" id="drop"><i class="fas fa-image"></i><strong>Choose an image</strong><small>Tap here, use camera, or drag & drop</small><input id="file" type="file" accept="image/*" capture="environment" hidden></label>
<img id="preview" class="preview" alt="Selected image preview">
<div class="row"><button class="btn" id="extract" disabled>🔍 Extract Text</button><button class="btn secondary hidden" id="clear">Clear</button></div>
<div class="status" id="status">No image selected.</div><div class="meta" id="meta"></div>
</section>
<section class="panel hidden" id="resultPanel" style="margin-top:14px"><strong>Extracted Text</strong><div class="result" id="result"></div><div class="row"><button class="btn secondary" id="copy">Copy Text</button><button class="btn secondary" id="clean">✨ Clean with AI</button></div></section>
</main>
<script>
const SUPABASE_URL="https://yymzfjfkmsrymqhpnfqz.supabase.co",SUPABASE_KEY="sb_publishable_tEePI-aSGDkt_2S6oiEfPw_Hy_mEXkw";
const $=id=>document.getElementById(id);let file=null,raw="";
$("back").onclick=()=>location.href="features.html";$("drop").onclick=()=>$("file").click();$("file").onchange=e=>pick(e.target.files?.[0]);
["dragenter","dragover"].forEach(v=>$("drop").addEventListener(v,e=>{e.preventDefault();$("drop").classList.add("drag")}));
["dragleave","drop"].forEach(v=>$("drop").addEventListener(v,e=>{e.preventDefault();$("drop").classList.remove("drag")}));
$("drop").addEventListener("drop",e=>pick(e.dataTransfer.files?.[0]));
function status(t){$("status").textContent=t}
async function pick(f){if(!f)return;if(!f.type.startsWith("image/")){status("Please select an image.");return}if(f.size>15*1024*1024){status("Image is too large. Maximum size is 15 MB.");return}file=f;$("extract").disabled=false;$("clear").classList.remove("hidden");$("resultPanel").classList.add("hidden");$("meta").textContent=Math.round(f.size/1024)+" KB • "+f.type;
const url=URL.createObjectURL(f);$("preview").src=url;$("preview").style.display="block";status("Image ready. Tap Extract Text.")}
$("extract").onclick=async()=>{if(!file)return;$("extract").disabled=true;$("resultPanel").classList.remove("hidden");$("result").textContent="Reading image…";status("Extracting text with AI…");
try{const dataUrl=await toDataURL(file);const prompt="Extract ALL visible text from this image accurately. Preserve line breaks and obvious headings where possible. If there is no readable text, say that clearly. Do not invent text.";const r=await fetch(SUPABASE_URL+"/functions/v1/ai-chat",{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({question:prompt,history:[],research:false,image:dataUrl})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.answer)throw new Error(d.error||"AI service unavailable");raw=d.answer;$("result").textContent=raw;status("Text extracted.");}catch(e){$("result").textContent="Could not extract text from this image.";status(e.message||"AI service unavailable.");}finally{$("extract").disabled=false}};
$("copy").onclick=async()=>{if(!raw)return;try{await navigator.clipboard.writeText(raw);status("Text copied.");$("copy").textContent="Copied ✓";setTimeout(()=>$("copy").textContent="Copy Text",1200)}catch(_){status("Copy failed. Select and copy the text manually.")}};
$("clean").onclick=async()=>{if(!raw)return;$("clean").disabled=true;status("Cleaning text with AI…");try{const r=await fetch(SUPABASE_URL+"/functions/v1/ai-chat",{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({question:"Clean and format the following OCR text. Fix obvious spacing/OCR mistakes but do not change its meaning or add information:\n\n"+raw,history:[],research:false})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.answer)throw new Error(d.error||"AI service unavailable");raw=d.answer;$("result").textContent=raw;status("Text cleaned.");}catch(e){status(e.message||"Could not clean text.");}finally{$("clean").disabled=false}};
$("clear").onclick=()=>{file=null;raw="";$("file").value="";$("preview").src="";$("preview").style.display="none";$("extract").disabled=true;$("clear").classList.add("hidden");$("resultPanel").classList.add("hidden");$("meta").textContent="";status("No image selected.")};
function toDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
</script></body></html>
