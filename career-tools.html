<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=theme-color content=#0f8b8d><title>GlobeDisc — Career Tools</title><style>*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui}.top{background:#fff;border-bottom:1px solid #dcebec;padding:12px}.btn{border:0;border-radius:12px;padding:10px 14px;background:#e8f6f7;color:#0f7779;font-weight:700}.wrap{max-width:780px;margin:auto;padding:18px 14px}.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{border:1px solid #dcebec;border-radius:14px;padding:14px}.card button{margin-top:8px}textarea,input{width:100%;padding:11px;border:1px solid #cfe4e5;border-radius:11px;margin:6px 0;min-height:80px}.out{margin-top:10px;padding:12px;background:#f5fbfc;border-radius:12px;white-space:pre-wrap}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header class=top><button class=btn onclick=history.back()>←</button> <b>GlobeDisc · Career Tools</b></header><main class=wrap><section class=panel><h2>Career Toolkit</h2><div class=grid><div class=card><b>Job Search</b><p>Open targeted job search.</p><button class=btn onclick=openSearch('jobs')>Search Jobs</button></div><div class=card><b>Internships</b><p>Find internship opportunities.</p><button class=btn onclick=openSearch('internships')>Search Internships</button></div><div class=card><b>Skill Roadmap</b><textarea id=skill placeholder="Skill you want to learn"></textarea><button class=btn onclick=road()>Build Roadmap</button><div id=ro class=out></div></div><div class=card><b>Cover Letter</b><textarea id=role placeholder="Role + company + your key skills"></textarea><button class=btn onclick=letter()>Draft Structure</button><div id=co class=out></div></div></div></section></main><script>function openSearch(t){location.href='index.html?search='+encodeURIComponent(t)}function road(){let s=skill.value.trim()||'Web Development';ro.textContent='Roadmap for '+s+'\n1. Fundamentals\n2. Core concepts\n3. Small projects\n4. Portfolio project\n5. Interview practice\n6. Applications';}function letter(){let x=role.value.trim()||'the role';co.textContent='Cover Letter Structure\n\n1. Opening: why you are interested in '+x+'\n2. Relevant skills and projects\n3. Why you fit the role\n4. Short closing and call to action\n\nUse this structure to write a truthful, personalized letter.'}</script></body></html>
