<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=theme-color content=#0f8b8d><title>GlobeDisc — Calculator & Converter</title><style>*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui}.top{background:#fff;border-bottom:1px solid #dcebec;padding:12px}.btn{border:0;border-radius:12px;padding:10px 14px;background:#e8f6f7;color:#0f7779;font-weight:700}.wrap{max-width:760px;margin:auto;padding:18px 14px}.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:16px;margin-bottom:12px}.tabs{display:flex;gap:6px;flex-wrap:wrap}input,select{width:100%;padding:11px;border:1px solid #cfe4e5;border-radius:11px;margin:5px 0}.out{font-size:19px;font-weight:800;color:#0f8587;margin-top:12px}</style></head><body><header class=top><button class=btn onclick="GlobeDiscBack();return false">←</button> <b>GlobeDisc · Calculator</b></header><main class=wrap><section class=panel><div class=tabs><button class=btn onclick=tool('calc')>Calculator</button><button class=btn onclick=tool('unit')>Unit Converter</button><button class=btn onclick=tool('currency')>Currency</button></div></section><section class=panel id=app></section></main><script>function tool(t){if(t==='calc')app.innerHTML='<h3>Calculator</h3><input id=x placeholder="Example: 25*4+10"><button class=btn onclick=calculate()>Calculate</button><p class=out id=o></p>';if(t==='unit')app.innerHTML='<h3>Unit Converter</h3><input id=x type=number placeholder="Value"><select id=u><option value=kmmi>km → miles</option><option value=mikm>miles → km</option><option value=ckm>°C → °F</option><option value=fkc>°F → °C</option><option value=kgp>kg → lb</option><option value=lbk>lb → kg</option></select><button class=btn onclick=convert()>Convert</button><p class=out id=o></p>';if(t==='currency')app.innerHTML='<h3>Currency Converter</h3><input id=x type=number placeholder="Amount"><select id=u><option value=usd>USD → INR</option><option value=inr>INR → USD</option><option value=eur>EUR → INR</option><option value=gbp>GBP → INR</option></select><button class=btn onclick=currency()>Convert</button><p class=out id=o></p>'}function calculate(){try{o.textContent=Function('"use strict";return ('+x.value+')')()}catch(e){o.textContent='Invalid expression'}}function convert(){let v=+x.value||0,m={kmmi:v*.621371,mikm:v*1.609344,ckm:v*9/5+32,fkc:(v-32)*5/9,kgp:v*2.20462,lbk:v*.453592};o.textContent=m[u.value].toFixed(4)}function currency(){let v=+x.value||0,r={usd:83.5,inr:1/83.5,eur:90.8,gbp:108.2};o.textContent=(v*r[u.value]).toFixed(2)+' (indicative rate)'}tool('calc')</script><script src="/globedisc-mobile-navigation.js?v=20261004-nav-1" defer></script>\n</body></html>
