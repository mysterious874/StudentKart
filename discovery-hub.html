<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — Discovery Hub</title><link rel="icon" href="/icons/globedisc-icon-v2.svg"><style>*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui}.top{position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid #dcebec;padding:11px 14px;display:flex;gap:10px;align-items:center;z-index:4}.top button,.btn{border:0;border-radius:12px;padding:10px 13px;background:#e8f6f7;color:#0f7779;font-weight:700}.brand{font-weight:800}.page{max-width:980px;margin:auto;padding:16px 14px 60px}.hero,.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:18px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#e9fbfb,#fff)}h1{margin:3px 0}.muted{color:#65787a}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{display:block;text-decoration:none;color:inherit;border:1px solid #dcebec;border-radius:14px;padding:15px;background:#fbfefe}.icon{width:38px;height:38px;border-radius:11px;background:#e8f7f7;color:#0f8587;display:grid;place-items:center;margin-bottom:9px}.card strong{display:block}.card small{display:block;margin-top:4px;color:#718184}@media(max-width:650px){.grid{grid-template-columns:1fr}} .hub-search{display:flex;align-items:center;gap:8px;margin-top:16px;border:1px solid #cfe5e7;background:#fff;border-radius:14px;padding:6px 8px}.hub-search i{color:#0f8587;margin-left:7px}.hub-search input{flex:1;border:0;outline:0;background:transparent;padding:10px 4px;font:inherit}.hub-search button{border:0;border-radius:10px;background:#0f8587;color:#fff;width:42px;height:42px;cursor:pointer}.card{position:relative!important;width:100%;text-align:left;font:inherit;cursor:pointer}.card-arrow{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#0f8587;opacity:.7}.card:hover{border-color:#0f8587;transform:translateY(-1px);box-shadow:0 5px 18px rgba(15,139,141,.09)}</head><body><header class="top"><button onclick="location.href='features.html'">←</button><div class="brand">GlobeDisc · Discovery Hub</div></header><main class="page"><section class="hero"><span style="font-size:12px;color:#0f8587;font-weight:800">DISCOVER MORE</span><h1>Find anything faster.</h1><p class="muted">Jump straight into focused GlobeDisc searches for news, videos, places, shopping, sports, entertainment, food, books and more.</p><div class="hub-search"><i class="fas fa-search"></i><input id="hubSearch" type="search" placeholder="Search all you need..." autocomplete="off"><button id="hubSearchButton" type="button" aria-label="Search"><i class="fas fa-arrow-right"></i></button></div></section><section class="panel"><div class="grid" id="grid"></div></section></main><script>const items=[["Latest News","latest news today","fa-newspaper"],["Sports","sports scores news fixtures","fa-futbol"],["Videos","videos and tutorials","fa-play"],["Photos","photos and images","fa-images"],["Movies & TV","movies tv shows reviews","fa-film"],["Music","songs albums artists","fa-music"],["Books","books authors summaries","fa-book"],["Recipes","recipes cooking ingredients","fa-utensils"],["Restaurants","restaurants near me","fa-utensils"],["Shopping","products prices reviews","fa-cart-shopping"],["Hotels","hotels and stays","fa-hotel"],["Jobs","jobs internships hiring","fa-briefcase"],["Tech","technology gadgets software","fa-microchip"],["Science","science discoveries research","fa-flask"],["Space","space astronomy NASA","fa-rocket"],["Education","courses colleges learning","fa-graduation-cap"],["Travel","destinations places itinerary","fa-plane"],["Events","events concerts festivals","fa-calendar-days"],["Local Services","services near me","fa-location-dot"],["Trending","trending topics today","fa-fire"]];const grid=document.getElementById("grid"); const input=document.getElementById("hubSearch"); const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); function go(q){q=String(q||"").trim();if(q)location.href="index.html?search="+encodeURIComponent(q)} grid.innerHTML=items.map(x=>'<button type="button" class="card" data-query="'+esc(x[1])+'"><div class="icon"><i class="fas '+x[2]+'"></i></div><strong>'+esc(x[0])+'</strong><small>'+esc(x[1])+'</small><span class="card-arrow"><i class="fas fa-arrow-right"></i></span></button>').join(""); grid.addEventListener("click",e=>{const b=e.target.closest("[data-query]");if(b)go(b.dataset.query)}); document.getElementById("hubSearchButton").addEventListener("click",()=>go(input.value)); input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();go(input.value)}}); document.querySelector(".top button").onclick=()=>{if(document.referrer&&document.referrer.includes(location.host))history.back();else location.href="index.html"};</script><script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script></body></html>
