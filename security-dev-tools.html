<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — Security & Dev Tools</title><link rel="icon" href="/icons/globedisc-icon-v2.svg"><style>*{box-sizing:border-box}body{margin:0;background:#f5fbfc;color:#102a2c;font:14px system-ui}.top{position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid #dcebec;padding:11px 14px;display:flex;gap:10px;align-items:center;z-index:5}.top button,.btn{border:0;border-radius:12px;padding:10px 13px;background:#e8f6f7;color:#0f7779;font-weight:700}.brand{font-weight:800}.page{max-width:980px;margin:auto;padding:16px 14px 60px}.hero,.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:18px;margin-bottom:12px}.hero{background:linear-gradient(135deg,#e9fbfb,#fff)}h1{margin:3px 0}.muted{color:#65787a}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{border:1px solid #dcebec;border-radius:14px;padding:14px;background:#fbfefe}.icon{width:38px;height:38px;border-radius:11px;background:#e8f7f7;color:#0f8587;display:grid;place-items:center;margin-bottom:9px}input,textarea,select{width:100%;padding:10px;border:1px solid #cfe4e5;border-radius:11px;margin:5px 0;font:inherit}textarea{min-height:100px}.row{display:flex;gap:7px;flex-wrap:wrap}.out{white-space:pre-wrap;word-break:break-word;background:#f7fcfc;border:1px solid #dcebec;border-radius:11px;padding:11px;margin-top:8px}.meter{height:9px;border-radius:8px;background:#e7eeee;margin:8px 0;overflow:hidden}.meter i{display:block;height:100%;width:0;background:#0f8b8d}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><button onclick="location.href='cybersecurity-hub.html'">←</button><div class="brand">GlobeDisc · Security & Dev</div></header><main class="page"><section class="hero"><span style="font-size:12px;color:#0f8587;font-weight:800">SECURITY TOOLKIT</span><h1>Useful tools, processed in your browser.</h1><p class="muted">Sensitive text stays on this page. Hashes use the browser Web Crypto API.</p></section><section class="panel"><div class="grid"><button class="card" onclick="openT('pass')"><div class="icon">🔐</div><b>Password Generator</b><small>Generate strong random passwords</small></button><button class="card" onclick="openT('hash')"><div class="icon">#</div><b>Hash Generator</b><small>SHA-256 / SHA-384 / SHA-512</small></button><button class="card" onclick="openT('jwt')"><div class="icon">🔎</div><b>JWT Decoder</b><small>Decode header and payload locally</small></button><button class="card" onclick="openT('regex')"><div class="icon">.*</div><b>Regex Tester</b><small>Test patterns against text</small></button><button class="card" onclick="openT('uuid')"><div class="icon">🆔</div><b>UUID Generator</b><small>Generate cryptographic UUIDs</small></button><button class="card" onclick="openT('entropy')"><div class="icon">🛡️</div><b>Password Strength</b><small>Local estimate of password strength</small></button></div></section><section class="panel"><div id="tool"><p class="muted">Choose a tool.</p></div></section></main><script>
const box=document.getElementById("tool");
function openT(n){const m={pass:`<h3>Password Generator</h3><label>Length: <b id="pl">20</b></label><input id="plen" type="range" min="8" max="64" value="20" oninput="pl.textContent=this.value"><label><input id="pup" type="checkbox" checked> Uppercase</label> <label><input id="plo" type="checkbox" checked> Lowercase</label> <label><input id="pno" type="checkbox" checked> Numbers</label> <label><input id="psy" type="checkbox" checked> Symbols</label><div class="row"><button class="btn" onclick="genPass()">Generate</button><button class="btn" onclick="copyOut('pout')">Copy</button></div><div id="pout" class="out"></div>`,hash:`<h3>Hash Generator</h3><textarea id="hin" placeholder="Text to hash"></textarea><select id="halg"><option>SHA-256</option><option>SHA-384</option><option>SHA-512</option></select><button class="btn" onclick="hashIt()">Generate hash</button><div id="hout" class="out"></div>`,jwt:`<h3>JWT Decoder</h3><textarea id="jwtin" placeholder="Paste a JWT"></textarea><button class="btn" onclick="decodeJwt()">Decode</button><div id="jwtout" class="out"></div><small class="muted">Decoding does not verify a token's signature.</small>`,regex:`<h3>Regex Tester</h3><input id="rx" placeholder="Regular expression, e.g. ^\\d+$"><input id="rxt" placeholder="Text to test"><div class="row"><button class="btn" onclick="testRx()">Test</button></div><div id="rxout" class="out"></div>`,uuid:`<h3>UUID Generator</h3><button class="btn" onclick="makeUuid()">Generate UUID</button><div id="uuidout" class="out"></div>`,entropy:`<h3>Password Strength</h3><input id="sin" type="password" placeholder="Enter a password"><button class="btn" onclick="strength()">Check locally</button><div class="meter"><i id="sm"></i></div><div id="sout" class="out"></div>`};box.innerHTML=m[n]}
function genPass(){let c="",v="";if(pup.checked)v+="ABCDEFGHJKLMNPQRSTUVWXYZ";if(plo.checked)v+="abcdefghijkmnopqrstuvwxyz";if(pno.checked)v+="23456789";if(psy.checked)v+="!@#$%^&*()-_=+[]{}";if(!v){pout.textContent="Select at least one character set.";return}const a=new Uint32Array(Number(plen.value));crypto.getRandomValues(a);for(let x of a)c+=v[x%v.length];pout.textContent=c}
async function hashIt(){const b=new TextEncoder().encode(hin.value),h=await crypto.subtle.digest(halg.value,b);hout.textContent=[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function decodeJwt(){const p=jwtin.value.trim().split(".");if(p.length!==3){jwtout.textContent="Invalid JWT format.";return}try{const dec=x=>JSON.stringify(JSON.parse(atob(p[x].replace(/-/g,"+").replace(/_/g,"/"))),null,2);jwtout.textContent="HEADER\n"+dec(0)+"\n\nPAYLOAD\n"+dec(1)}catch{jwtout.textContent="JWT contains invalid Base64URL JSON."}}
function testRx(){try{const r=new RegExp(rx.value,"g"),a=[...rxt.value.matchAll(r)];rxout.textContent=a.length?"Matches: "+a.map(x=>x[0]).join(" | "):"No match."}catch(e){rxout.textContent="Invalid regex: "+e.message}}
function makeUuid(){uuidout.textContent=crypto.randomUUID()}
function strength(){const p=sin.value,s=(p.length>=12)+(p.length>=16)+(/[a-z]/.test(p))+( /[A-Z]/.test(p))+( /\d/.test(p))+( /[^A-Za-z0-9]/.test(p));sm.style.width=(s/6*100)+"%";sout.textContent=s<=2?"Weak":s<=4?"Moderate":"Strong"}
async function copyOut(id){await navigator.clipboard?.writeText(document.getElementById(id).textContent)}
</script></body></html>
