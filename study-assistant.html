<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f8b8d"><title>GlobeDisc — Study Assistant</title><link rel="icon" href="/icons/globedisc-icon-v2.svg"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5fbfc;color:#102a2c}.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid #dceced;padding:12px 16px;display:flex;align-items:center;gap:12px}.back{border:0;background:#e8f6f7;border-radius:12px;width:42px;height:42px;color:#0f7779;font-size:16px}.brand{display:flex;gap:9px;align-items:center}.brand img{width:36px;height:36px}.brand strong{display:block}.brand small{color:#668184}main{max-width:850px;margin:auto;padding:20px 14px 50px}.hero,.panel{background:#fff;border:1px solid #dcebec;border-radius:18px;padding:18px;margin-bottom:14px}.hero{background:linear-gradient(135deg,#e9fbfb,#fff);border-color:#d7eeee}.ey{font-size:12px;color:#0f8587;font-weight:700}.hero h1{margin:5px 0;font-size:28px}.hero p{margin:7px 0;color:#607477;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:12px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:700;color:#557174;margin-bottom:7px}input,textarea,select{width:100%;border:1px solid #cfe4e5;border-radius:12px;background:#fbfefe;color:#17383b;padding:11px 12px;font:inherit}textarea{min-height:170px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#0f8b8d;color:#fff}.secondary{background:#e8f6f7;color:#0f7779}.status{font-size:12px;color:#718486;margin-top:9px;min-height:17px}.result{display:none;margin-top:14px;border:1px solid #dcebec;border-radius:14px;overflow:hidden}.rhead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#eef9f9;border-bottom:1px solid #dcebec;font-size:13px;font-weight:700}.result pre{margin:0;padding:16px;white-space:pre-wrap;word-break:break-word;font:13px/1.6 system-ui;color:#183b3e;background:#fbfefe}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.hero h1{font-size:25px}}</style></head><body><header class="top"><button class="back" onclick="location.href='features.html'">←</button><div class="brand"><img src="/icons/globedisc-icon-v2.svg"><div><strong>GlobeDisc</strong><small>Study Assistant</small></div></div></header><main><section class="hero"><div class="ey">STUDY · AI ASSISTANT</div><h1>Learn it clearly</h1><p>Ask a doubt, concept, question or problem. Get a step-by-step explanation matched to your level.</p></section><section class="panel"><div class="grid"><div class="field"><label>Subject</label><select id="subject"><option>General</option><option>Computer Science</option><option>Programming</option><option>Cybersecurity</option><option>Mathematics</option><option>Physics</option><option>Chemistry</option><option>Biology</option><option>English</option><option>Business / Commerce</option><option>Other</option></select></div><div class="field"><label>Level</label><select id="level"><option>Beginner</option><option>School</option><option>College</option><option>Advanced</option></select></div><div class="field"><label>Response style</label><select id="style"><option>Simple explanation</option><option>Step by step</option><option>Exam focused</option><option>Detailed concept</option><option>With examples</option></select></div><div class="field"><label>Language</label><select id="language"><option>English</option><option>Hindi</option><option>Marathi</option><option>Gujarati</option><option>Gor Boli / Lambadi</option></select></div><div class="field full"><label>Your question / doubt</label><textarea id="question" placeholder="Example: Explain TCP three-way handshake with a simple example..."></textarea></div></div><div class="actions"><button class="btn primary" id="ask">Explain with AI</button><button class="btn secondary" id="clear">Clear</button></div><div class="status" id="status"></div><div class="result" id="result"><div class="rhead"><span>Study Answer</span><button class="btn secondary" id="copy" style="padding:7px 10px;font-size:12px">Copy</button></div><pre id="answer"></pre></div></section></main><script>const URL="https://yymzfjfkmsrymqhpnfqz.supabase.co",KEY="sb_publishable_tEePI-aSGDkt_2S6oiEfPw_Hy_mEXkw",$=id=>document.getElementById(id);async function ask(){const q0=$("question").value.trim();if(!q0){$("status").textContent="Enter your question or doubt first.";return}const q=`Act as a patient study assistant. Subject: ${$("subject").value}. Student level: ${$("level").value}. Preferred style: ${$("style").value}. Language: ${$("language").value}. Question: ${q0}. Explain accurately and clearly at the student's level. Use step-by-step reasoning, examples, formulas or code when useful. Define difficult terms. Do not invent facts. If the question is ambiguous, state the assumption briefly. Make the answer useful for learning and exams.`;$("ask").disabled=true;$("status").textContent="Preparing your explanation…";$("result").style.display="none";try{const r=await fetch(URL+"/functions/v1/ai-chat",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({question:q,history:[],research:false})});const x=await r.json();if(!r.ok)throw Error(x?.error||x?.message||"AI request failed");$("answer").textContent=x.answer||x.response||x.text||x.message||"No answer returned.";$("result").style.display="block";$("status").textContent="Explanation ready."}catch(e){$("status").textContent="Could not generate answer. "+e.message}finally{$("ask").disabled=false}}$("ask").onclick=ask;$("clear").onclick=()=>{document.querySelectorAll("textarea").forEach(x=>x.value="");$("result").style.display="none";$("answer").textContent="";$("status").textContent=""};$("copy").onclick=async()=>{await navigator.clipboard.writeText($("answer").textContent);$("status").textContent="Answer copied."}</script></body></html>
